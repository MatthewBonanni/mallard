# Hagen-Poiseuille flow in a round pipe (axisymmetric): a body force drives
# the gas through a pipe of radius 1, periodic along its axis, from rest to the
# steady parabolic profile u = U (1 - r^2), U = rho g / (4 mu) = 0.01 (Mach
# 0.01, so the viscous heating is negligible). Check the profile against the
# exact r-weighted cell averages with
#   python ../../tools/plot_poiseuille.py poiseuille.png solut/pipe_000001.vtu
# Mean error of the cell averages over U: 1.28e-3, 3.22e-4, 8.0e-5 for
# Ny = 16, 32, 64 (second order; set Lx = 4 / Ny to keep square cells).
# Ny = 64 takes 3 minutes on one thread (790,000 viscous-limited steps).

[run]
t_stop = 30.0
cfl = 0.8

[mesh]
type = "cartesian"
Nx = 4
Ny = 32
Lx = 0.125
Ly = 1.0
periodic = ["x"]

[initialize]
type = "constant"
u = [0.0, 0.0]
p = 0.7142857142857143
T = 0.7142857142857143

[[boundaries]]
name = "bottom"
type = "symmetry"

[[boundaries]]
name = "top"
type = "wall_isothermal"
T = 0.7142857142857143

[numerics]
riemann_solver = "HLLC"
time_integrator = "SSPRK3"

[numerics.face_reconstruction]
type = "MUSCL"

[physics]
type = "navier_stokes"
axisymmetric = true
gamma = 1.4
p_ref = 0.7142857142857143
T_ref = 0.7142857142857143
rho_ref = 1.0
mu = 0.1
Pr = 0.72

[source]
gravity = [0.004, 0.0]

[output]
check_interval = 5000

[[write_data]]
prefix = "./solut/pipe"
format = "vtu"
time_interval = 30.0
variables = ["RHO", "U_X", "U_Y", "P", "T"]
