# 2D Riemann problem, configuration 3 (Lax & Liu, SIAM J. Sci. Comput. 1998;
# Liska & Wendroff, SIAM J. Sci. Comput. 2003) on 160,000 quadrilaterals:
# four shocks meeting at (0.8, 0.8), run to t = 0.8 on the unit square with
# transmissive boundaries. examples/riemann_2d is the same case on triangles.
#
# Run:
#   ../../build/src/Mallard -i input.toml --kokkos-num-threads=8
#   python ../../tools/animate.py solut riemann
#
# Expected result at t = 0.8: the mushroom-shaped jet along the diagonal with
# Kelvin-Helmholtz roll-ups on its slip lines. The README animation uses
# Nx = Ny = 1000.

[run]
t_stop = 0.8
cfl = 0.5

[mesh]
type = "cartesian"
Nx = 400
Ny = 400
Lx = 1.0
Ly = 1.0

[initialize]
type = "analytical"
rho = """\
    x >= 0.8 ? (y >= 0.8 ? 1.5 : 0.532258064516129) \
             : (y >= 0.8 ? 0.532258064516129 : 0.137992831541219)"""
u = [
    "x >= 0.8 ? 0.0 : 1.206045378311055",
    "y >= 0.8 ? 0.0 : 1.206045378311055",
]
p = """\
    x >= 0.8 ? (y >= 0.8 ? 1.5 : 0.3) \
             : (y >= 0.8 ? 0.3 : 0.029032258064516)"""

[[boundaries]]
name = "left"
type = "extrapolation"

[[boundaries]]
name = "right"
type = "extrapolation"

[[boundaries]]
name = "top"
type = "extrapolation"

[[boundaries]]
name = "bottom"
type = "extrapolation"

[numerics]
riemann_solver = "HLLC"
time_integrator = "SSPRK3"
check_nan = true

[numerics.face_reconstruction]
type = "TENO"
order = 5

[physics]
type = "euler"
gamma = 1.4
p_ref = 1.0
T_ref = 1.0
rho_ref = 1.0

[output]
check_interval = 200

[[write_data]]
prefix = "./solut/riemann"
format = "vtu"
time_interval = 0.01
variables = ["RHO", "U_X", "U_Y", "P"]
