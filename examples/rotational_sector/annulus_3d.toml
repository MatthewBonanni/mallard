# The full duct of sector_3d.toml: run both and compare (see sector_3d.toml).

[run]
t_stop = 0.2
cfl = 0.8

[mesh]
type = "annulus"
angle = 360.0
Ntheta = 64
Nr = 12
Nz = 8
Lz = 0.5
r_inner = 1.0
r_outer = 2.0

[[periodic]]
zones = ["back", "front"]

[initialize]
type = "analytical"
rho = "1 + 0.2 * sin(8 * atan2(y, x)) + 0.1 * (sqrt(x^2 + y^2) - 1.5)"
p = "1 + 0.1 * sqrt(x^2 + y^2) * cos(8 * atan2(y, x))"
u = [
    "(0.1 * sin(8 * atan2(y, x)) * sin(pi * (sqrt(x^2 + y^2) - 1)) * x - (0.5 * sqrt(x^2 + y^2) + 0.1 * cos(8 * atan2(y, x))) * y) / sqrt(x^2 + y^2)",
    "(0.1 * sin(8 * atan2(y, x)) * sin(pi * (sqrt(x^2 + y^2) - 1)) * y + (0.5 * sqrt(x^2 + y^2) + 0.1 * cos(8 * atan2(y, x))) * x) / sqrt(x^2 + y^2)",
    "0.2 + 0.1 * sin(4 * pi * z) * cos(8 * atan2(y, x))",
]

[[boundaries]]
name = "inner"
type = "symmetry"

[[boundaries]]
name = "outer"
type = "symmetry"

[numerics]
riemann_solver = "HLLC"
time_integrator = "SSPRK3"

[numerics.face_reconstruction]
type = "TENO"
order = 5

[physics]
type = "euler"
gamma = 1.4
p_ref = 1.0
T_ref = 1.0
rho_ref = 1.0

[output]
check_interval = 100

[[write_data]]
prefix = "./solut/annulus_3d"
time_interval = 0.2
variables = ["RHO", "RHOU", "RHOE", "P"]
