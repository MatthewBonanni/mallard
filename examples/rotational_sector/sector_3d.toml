# The 3D version of sector.toml (3D build): a quarter (90 degrees) of the annular
# duct 1 <= r <= 2, 0 <= z <= 0.5, periodic in theta (a rotation) and in z (a
# translation along the axis), with an axial wave, against the full duct
# (annulus_3d.toml):
#   ../../build3d/src/Mallard -i sector_3d.toml --kokkos-num-threads=4
#   ../../build3d/src/Mallard -i annulus_3d.toml --kokkos-num-threads=4
#   python ../../tools/rotational_sector.py solut/sector_3d_000001.vtu solut/annulus_3d_000001.vtu --sectors 4
#
# Result (TENO5, t = 0.2, 16 steps): the sector and the full duct agree to
# 8.0e-15, as the duct agrees with its own copies (8.9e-15). 1,536 and 6,144
# hexahedra, 16 and 50 s on 2 threads.

[run]
t_stop = 0.2
cfl = 0.8

[mesh]
type = "annulus"
angle = 90.0
Ntheta = 16
Nr = 12
Nz = 8
Lz = 0.5
r_inner = 1.0
r_outer = 2.0
periodic = ["theta", "z"]

[initialize]
type = "analytical"
rho = "1 + 0.2 * sin(8 * atan2(y, x)) + 0.1 * (sqrt(x^2 + y^2) - 1.5)"
p = "1 + 0.1 * sqrt(x^2 + y^2) * cos(8 * atan2(y, x))"
u = [
    "(0.1 * sin(8 * atan2(y, x)) * sin(pi * (sqrt(x^2 + y^2) - 1)) * x - (0.5 * sqrt(x^2 + y^2) + 0.1 * cos(8 * atan2(y, x))) * y) / sqrt(x^2 + y^2)",
    "(0.1 * sin(8 * atan2(y, x)) * sin(pi * (sqrt(x^2 + y^2) - 1)) * y + (0.5 * sqrt(x^2 + y^2) + 0.1 * cos(8 * atan2(y, x))) * x) / sqrt(x^2 + y^2)",
    "0.2 + 0.1 * sin(4 * pi * z) * cos(8 * atan2(y, x))",
]

[[boundaries]]
name = "inner"
type = "symmetry"

[[boundaries]]
name = "outer"
type = "symmetry"

[numerics]
riemann_solver = "HLLC"
time_integrator = "SSPRK3"

[numerics.face_reconstruction]
type = "TENO"
order = 5

[physics]
type = "euler"
gamma = 1.4
p_ref = 1.0
T_ref = 1.0
rho_ref = 1.0

[output]
check_interval = 100

[[write_data]]
prefix = "./solut/sector_3d"
format = "vtu"
time_interval = 0.2
variables = ["RHO", "RHOU", "RHOE", "P"]
