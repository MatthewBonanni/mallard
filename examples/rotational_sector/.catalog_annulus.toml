# The full annulus of sector.toml: run both and compare (see sector.toml).

[run]
t_stop = 0.5
cfl = 0.8

[mesh]
type = "annulus"
angle = 360.0
Ntheta = 256
Nr = 64
r_inner = 1.0
r_outer = 2.0

[initialize]
type = "analytical"
rho = "1 + 0.2 * sin(8 * atan2(y, x)) + 0.1 * (sqrt(x^2 + y^2) - 1.5)"
p = "1 + 0.1 * sqrt(x^2 + y^2) * cos(8 * atan2(y, x))"
u = [
    "(0.1 * sin(8 * atan2(y, x)) * sin(pi * (sqrt(x^2 + y^2) - 1)) * x - (0.5 * sqrt(x^2 + y^2) + 0.1 * cos(8 * atan2(y, x))) * y) / sqrt(x^2 + y^2)",
    "(0.1 * sin(8 * atan2(y, x)) * sin(pi * (sqrt(x^2 + y^2) - 1)) * y + (0.5 * sqrt(x^2 + y^2) + 0.1 * cos(8 * atan2(y, x))) * x) / sqrt(x^2 + y^2)",
]

[[boundaries]]
name = "inner"
type = "symmetry"

[[boundaries]]
name = "outer"
type = "symmetry"

[numerics]
riemann_solver = "HLLC"
time_integrator = "SSPRK3"

[numerics.face_reconstruction]
type = "TENO"
order = 5

[physics]
type = "euler"
gamma = 1.4
p_ref = 1.0
T_ref = 1.0
rho_ref = 1.0

[output]
check_interval = 100

[[write_data]]
prefix = "./solut/annulus"
format = "vtu"
time_interval = 0.5
variables = ["RHO", "RHOU", "RHOE", "P"]
