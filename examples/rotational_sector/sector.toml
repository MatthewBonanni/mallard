# Rotational periodicity: a swirling flow in a quarter of the annulus
# 1 <= r <= 2 (a 90 degree sector), against the same flow on the full annulus
# (annulus.toml). The state has the sector's period: a solid-body swirl with
# azimuthal and radial waves of 8 periods around, between slip walls. The full
# annulus is four copies of the sector's mesh, so both runs must agree to
# rounding, the sector's velocity turned by k 90 degrees in copy k.
#
# A quarter, not a smaller sector: MUSCL's limiter acts on each Cartesian
# velocity component and TENO's smoothness indicators weigh the Cartesian
# derivatives, so the schemes are invariant under rotations by multiples of
# 90 degrees only. Sectors of other angles are as accurate, but agree with the
# full annulus to the truncation error rather than to rounding.
#
# Run (2D build), then compare:
#   ../../build/src/mallard -i sector.toml --kokkos-num-threads=4
#   ../../build/src/mallard -i annulus.toml --kokkos-num-threads=4
#   python rotational_sector.py solut/sector_000001.vtu solut/annulus_000001.vtu --sectors 4
#
# Result at t = 0.5, 110 steps through steepening waves: with TENO5 the sector
# and the annulus agree to 1.0e-10, as the annulus agrees with its own copies
# (9.8e-11: rounding, amplified by the stencil selection); with MUSCL to 5e-14.
# 4,096 and 16,384 quads, about a minute on one thread.

[run]
t_stop = 0.5
cfl = 0.8

[mesh]
type = "annulus"
angle = 90.0
Ntheta = 64
Nr = 64
r_inner = 1.0
r_outer = 2.0
periodic = ["theta"]

[initialize]
type = "analytical"
rho = "1 + 0.2 * sin(8 * atan2(y, x)) + 0.1 * (sqrt(x^2 + y^2) - 1.5)"
p = "1 + 0.1 * sqrt(x^2 + y^2) * cos(8 * atan2(y, x))"
u = [
    "(0.1 * sin(8 * atan2(y, x)) * sin(pi * (sqrt(x^2 + y^2) - 1)) * x - (0.5 * sqrt(x^2 + y^2) + 0.1 * cos(8 * atan2(y, x))) * y) / sqrt(x^2 + y^2)",
    "(0.1 * sin(8 * atan2(y, x)) * sin(pi * (sqrt(x^2 + y^2) - 1)) * y + (0.5 * sqrt(x^2 + y^2) + 0.1 * cos(8 * atan2(y, x))) * x) / sqrt(x^2 + y^2)",
]

[[boundaries]]
name = "inner"
type = "symmetry"

[[boundaries]]
name = "outer"
type = "symmetry"

[numerics]
riemann_solver = "HLLC"
time_integrator = "SSPRK3"

[numerics.face_reconstruction]
type = "TENO"
order = 5

[physics]
type = "euler"
gamma = 1.4
p_ref = 1.0
T_ref = 1.0
rho_ref = 1.0

[output]
check_interval = 100

[[write_data]]
prefix = "./solut/sector"
format = "vtu"
time_interval = 0.5
variables = ["RHO", "RHOU", "RHOE", "P"]
