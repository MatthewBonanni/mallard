# Rotational periodicity: a swirling flow in a 45 degree sector of the annulus
# 1 <= r <= 2, against the same flow on the full annulus (annulus.toml). The
# state has the sector's period: a solid-body swirl with azimuthal and radial
# waves of 8 periods around, between slip walls. The full annulus is eight
# copies of the sector's mesh, so both runs must agree to rounding, the
# sector's velocity turned by k 45 degrees in copy k.
#
# Run (2D build), then compare:
#   ../../build/src/Mallard -i sector.toml --kokkos-num-threads=4
#   ../../build/src/Mallard -i annulus.toml --kokkos-num-threads=4
#   python ../../tools/rotational_sector.py compare solut/sector_00001.vtu solut/annulus_00001.vtu --sectors 8
#
# Result (TENO5, t = 0.5): the annulus and the turned sector agree to
# 5e-15 in density, momentum and energy (max over all cells). 2,048 and 16,384
# quads, seconds on 4 threads.

[run]
t_stop = 0.5
cfl = 0.8

[mesh]
type = "annulus"
angle = 45.0
Ntheta = 32
Nr = 64
r_inner = 1.0
r_outer = 2.0
periodic = ["theta"]

[initialize]
type = "analytical"
rho = "1 + 0.2 * sin(8 * atan2(y, x)) + 0.1 * (sqrt(x^2 + y^2) - 1.5)"
p = "1 + 0.1 * sqrt(x^2 + y^2) * cos(8 * atan2(y, x))"
u = [
    "(0.1 * sin(8 * atan2(y, x)) * sin(pi * (sqrt(x^2 + y^2) - 1)) * x - (0.5 * sqrt(x^2 + y^2) + 0.1 * cos(8 * atan2(y, x))) * y) / sqrt(x^2 + y^2)",
    "(0.1 * sin(8 * atan2(y, x)) * sin(pi * (sqrt(x^2 + y^2) - 1)) * y + (0.5 * sqrt(x^2 + y^2) + 0.1 * cos(8 * atan2(y, x))) * x) / sqrt(x^2 + y^2)",
]

[[boundaries]]
name = "inner"
type = "symmetry"

[[boundaries]]
name = "outer"
type = "symmetry"

[numerics]
riemann_solver = "HLLC"
time_integrator = "SSPRK3"

[numerics.face_reconstruction]
type = "TENO"
order = 5

[physics]
type = "euler"
gamma = 1.4
p_ref = 1.0
T_ref = 1.0
rho_ref = 1.0

[output]
check_interval = 100

[[write_data]]
prefix = "./solut/sector"
format = "vtu"
time_interval = 0.5
variables = ["RHO", "RHOU", "RHOE", "P"]
