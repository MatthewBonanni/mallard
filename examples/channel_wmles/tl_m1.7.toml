# Wall-modeled LES of the supersonic isothermal-wall channel at bulk Mach
# 1.7 and Re_tau* = 590 (3D build), the case M1.7R600 of Trettel & Larsson,
# Phys. Fluids 28, 026102 (2016), doi:10.1063/1.4942022, as tabulated by
# Griffin, Fu & Moin, J. Fluid Mech. 970, A36 (2023), doi:10.1017/jfm.2023.627
# (table 1: Re_b = 15,490, Re_tau = 963.6, Re_tau* = 590.8, -B_q = 0.04942).
# Design and results: docs/design/wall_model.md.
#
# Physics: walls at y = 0 and y = 2h, periodic in x and z, box 2 pi h x 2h x
# pi h. Units h = 1, bulk density and velocity 1 (held by [source]
# mass_flow, whose body force does work on the flow: the only energy source,
# removed through the walls), wall temperature 1. The gas constant sets
# M_b = U_b / c_w = 1.699 (R = 1 / (gamma M_b^2)), the wall viscosity Re_b =
# rho_b U_b h / mu_w = 15,490; mu ~ T^0.75, Pr = 0.7, as the DNS.
#
# Wall model: Griffin, Fu & Moin (2023), exchange point at 0.3 h, edge at the
# centerline; for the equilibrium ODE model set model = "equilibrium" and
# remove edge_distance.
#
# LES: Sigma with Scotti's width, hybrid KEEP / HLLC flux, MUSCL without
# limiter, 72 x 24 x 36 uniform hexahedra (h / 12).
#
# Results, statistics over t = 200-800 h/U_b (26 h/u_tau), both walls (DNS
# in parentheses; T_c / T_w = (Re_tau / Re_tau*)^0.8 for mu ~ T^0.75):
#
#                     GFM              equilibrium ODE
#   Re_tau (963.6)    991.5 +2.9%      977.1 +1.4%
#   B_q (-0.04942)    -0.05008 +1.3%   -0.05089 +3.0%
#   T_c / T_w (1.479) 1.482 +0.2%      1.449 -2.1%
#
# Run:
#   python wmles_channel.py init tl_m1.7.toml init.restart
#   ../../build3d/src/mallard -i tl_m1.7.toml
#   python ../../tools/post/plane_average.py stats/channel_<last>.vtkhdf --average x z --out profile.csv
#   python wmles_channel.py analyze tl_m1.7.toml forces_bottom.csv forces_top.csv \
#       --t-start 200 --reference tl-m1.7 --profile profile.csv

[run]
t_stop = 800.0
cfl = 0.9

[mesh]
type = "cartesian"
Nx = 72
Ny = 24
Nz = 36
Lx = 6.283185307179586
Ly = 2.0
Lz = 3.141592653589793
periodic = ["x", "z"]

[initialize]
type = "restart"
file = "init.restart"

[[boundaries]]
name = "bottom"
type = "wall_isothermal"
T = 1.0
wall_model = { model = "gfm", exchange_distance = 0.3, edge_distance = 1.0 }

[[boundaries]]
name = "top"
type = "wall_isothermal"
T = 1.0
wall_model = { model = "gfm", exchange_distance = 0.3, edge_distance = 1.0 }

[source]
mass_flow = [1.0, 0.0, 0.0]

[numerics]
riemann_solver = "HLLC"
convective_flux = "hybrid"
time_integrator = "SSPRK3"
check_nan = true

[numerics.face_reconstruction]
type = "MUSCL"
limiter = "none"

[physics]
type = "navier_stokes"
gamma = 1.4
p_ref = 0.2474487171
T_ref = 1.0
rho_ref = 1.0
mu = 6.45577792123951e-05
viscosity_model = "power_law"
T_mu_ref = 1.0
viscosity_exponent = 0.75
Pr = 0.7

[les]
model = "sigma"

[statistics]
fields = ["RHO", "U_X", "U_Y", "U_Z", "P", "T"]
products = ["U_X*U_X", "U_Y*U_Y", "U_Z*U_Z", "U_X*U_Y"]
t_start = 200.0
interval = 10

[output]
check_interval = 10000

[integrals]
interval = 5000
budget = true

[[forces]]
zone = "bottom"
interval = 50
file = "forces_bottom.csv"

[[forces]]
zone = "top"
interval = 50
file = "forces_top.csv"

[[write_data]]
prefix = "./stats/channel"
time_interval = 200.0
variables = ["MEAN_*", "COV_*"]

[[write_data]]
prefix = "./restart/channel"
format = "restart"
interval = 100000
