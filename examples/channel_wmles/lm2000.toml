# Wall-modeled LES of turbulent channel flow at Re_tau = 2000 (3D build),
# against the DNS of Lee & Moser, J. Fluid Mech. 774, 395 (2015),
# doi:10.1017/jfm.2015.268. Design and results: docs/design/wall_model.md.
#
# Physics: walls at y = 0 and y = 2h, periodic in x and z, box 2 pi h x 2h x
# pi h. Units h = 1, bulk density and velocity 1, held by [source] mass_flow,
# so Re_b = 2 h U_b / nu = 86,957 as in Lee & Moser (U_b+ = 21.80); Re_tau
# comes out of the run. Bulk Mach 0.2, isothermal walls at the bulk
# temperature, Pr = 0.72.
#
# Wall model: Griffin, Fu & Moin (2023) with the exchange point at 0.3 h and
# the edge state at the centerline (edge_distance = h); for the equilibrium
# ODE model set model = "equilibrium" and remove edge_distance.
#
# LES: Sigma with Scotti's width, hybrid KEEP / HLLC flux, MUSCL without
# limiter, on uniform hexahedra of h / 12 (Griffin et al.'s resolution):
# 72 x 24 x 36 cells.
#
# Results, statistics over t = 200-1200 h/U_b (46 h/u_tau), both walls
# (Lee & Moser in parentheses):
#
#                  GFM              equilibrium ODE
#   Re_tau (1995)  2021.7 +1.4%     2018.8 +1.2%
#   Cf             +2.1%            +1.8%
#   U+ at y/h = 0.1 / 0.3 / 0.5 (18.13 / 21.12 / 22.66)
#                  17.51 / 20.69 / 22.45   17.55 / 20.72 / 22.46
#
# Run:
#   python ../../tools/wmles_channel.py init lm2000.toml init.restart
#   ../../build3d/src/mallard -i lm2000.toml
#   python ../../tools/plane_average.py stats/channel_<last>.vtu --average x z --out profile.csv
#   python ../../tools/wmles_channel.py analyze lm2000.toml forces_bottom.csv forces_top.csv \
#       --t-start 200 --reference lm2000 --profile profile.csv

[run]
t_stop = 1200.0
cfl = 0.9

[mesh]
type = "cartesian"
Nx = 72
Ny = 24
Nz = 36
Lx = 6.283185307179586
Ly = 2.0
Lz = 3.141592653589793
periodic = ["x", "z"]

[initialize]
type = "restart"
file = "init.restart"

[[boundaries]]
name = "bottom"
type = "wall_isothermal"
T = 1.0
wall_model = { model = "gfm", exchange_distance = 0.3, edge_distance = 1.0 }

[[boundaries]]
name = "top"
type = "wall_isothermal"
T = 1.0
wall_model = { model = "gfm", exchange_distance = 0.3, edge_distance = 1.0 }

[source]
mass_flow = [1.0, 0.0, 0.0]

[numerics]
riemann_solver = "HLLC"
convective_flux = "hybrid"
time_integrator = "SSPRK3"
check_nan = true

[numerics.face_reconstruction]
type = "MUSCL"
limiter = "none"

[physics]
type = "navier_stokes"
gamma = 1.4
p_ref = 17.857142857142858
T_ref = 1.0
rho_ref = 1.0
mu = 2.3e-5
Pr = 0.72

[les]
model = "sigma"

[statistics]
fields = ["RHO", "U_X", "U_Y", "U_Z", "P", "T"]
products = ["U_X*U_X", "U_Y*U_Y", "U_Z*U_Z", "U_X*U_Y"]
t_start = 200.0
interval = 10

[output]
check_interval = 10000

[integrals]
interval = 5000
budget = true

[[forces]]
zone = "bottom"
interval = 50
file = "forces_bottom.csv"

[[forces]]
zone = "top"
interval = 50
file = "forces_top.csv"

[[write_data]]
prefix = "./stats/channel"
format = "vtu"
time_interval = 200.0
variables = ["MEAN_*", "COV_*"]

[[write_data]]
prefix = "./restart/channel"
format = "restart"
interval = 100000
