# Wall-resolved LES of turbulent channel flow at Re_tau = 590 (3D build), the
# setup of input.toml (Re_tau = 395) at MKM's Re_tau = 590 (Moser, Kim &
# Mansour, Phys. Fluids 11, 943, 1999, doi:10.1063/1.869966; Lee & Moser,
# J. Fluid Mech. 774, 395, 2015, doi:10.1017/jfm.2015.268): Re_b = 2 h U_b /
# nu = 21,907 (U_b+ = 18.65), 96^3 hexahedra, dx+ = 38, dz+ = 19, dy+ = 0.87
# at the wall. Sigma model with Scotti's filter width (the 3D default),
# hybrid KEEP / HLLC flux, MUSCL without limiter; statistics from t = 60
# h/U_b. Design and results: docs/design/les.md, section 8.2.
#
# Results, averaged over t = 60-200 h/U_b (7.6-8.1 h/u_tau), resolved
# fluctuations (MKM in parentheses):
#
#                        Sigma (Scotti)  Sigma, V^(1/3)  no model
#   Re_tau (587.2)       596.6 +1.6%     611.0 +4.1%     632.7 +7.8%
#   Cf (0.00575)         +2.9%           +7.9%           +15.7%
#   U+ at y+ = 30 (13.53)  13.33         12.90           12.18
#   U+ at y+ = 100 (16.54) 16.43         15.88           14.92
#   peak u_rms+ (2.77)   2.84            2.83            2.78
#   peak v_rms+ (1.04)   0.95            0.96            1.02
#   peak w_rms+ (1.37)   1.30            1.34            1.39
#   peak -u'v'+ (0.87)   0.84            0.85            0.88
#   numerical / SGS / molecular dissipation
#                        3.3 / 16.2 / 80.6%   2.3 / 13.5 / 84.2%   3.3 / 0 / 96.7%
#
# Cost: about 900,000 steps of 2.3e-4 h/U_b, 14 ms each on one A100: 3.5 hours.
#
# Run:
#   python ../../tools/channel_init.py input_590.toml init.restart
#   ../../build3d/src/Mallard -i input_590.toml

[run]
t_stop = 200.0
cfl = 0.9

[mesh]
type = "cartesian"
Nx = 96
Ny = 96
Nz = 96
Lx = 6.283185307179586
Ly = 2.0
Lz = 3.141592653589793
stretching = [0.0, 2.5, 0.0]
periodic = ["x", "z"]

[initialize]
type = "restart"
file = "init.restart"

[[boundaries]]
name = "bottom"
type = "wall_isothermal"
T = 1.0

[[boundaries]]
name = "top"
type = "wall_isothermal"
T = 1.0

[source]
mass_flow = [1.0, 0.0, 0.0]

[numerics]
riemann_solver = "HLLC"
convective_flux = "hybrid"
time_integrator = "SSPRK3"
check_nan = true

[numerics.face_reconstruction]
type = "MUSCL"
limiter = "none"

[physics]
type = "navier_stokes"
gamma = 1.4
p_ref = 17.857142857142858
T_ref = 1.0
rho_ref = 1.0
mu = 9.129583219e-05
Pr = 0.72

[les]
model = "sigma"

[statistics]
fields = ["RHO", "U_X", "U_Y", "U_Z", "P", "T"]
products = ["U_X*U_X", "U_Y*U_Y", "U_Z*U_Z", "U_X*U_Y"]
t_start = 60.0
interval = 10

[output]
check_interval = 5000

[integrals]
interval = 2000
budget = true

[[forces]]
zone = "bottom"
interval = 50
file = "forces_bottom.csv"

[[forces]]
zone = "top"
interval = 50
file = "forces_top.csv"

[[write_data]]
prefix = "./stats/channel"
format = "vtu"
time_interval = 50.0
variables = ["MEAN_*", "COV_*"]

[[write_data]]
prefix = "./restart/channel"
format = "restart"
interval = 50000
