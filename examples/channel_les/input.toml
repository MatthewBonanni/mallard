# Wall-resolved large-eddy simulation of turbulent channel flow at
# Re_tau = 395 (3D build), against the DNS of Moser, Kim & Mansour, Phys.
# Fluids 11, 943 (1999), doi:10.1063/1.869966 (MKM). Design and results:
# docs/design/les.md, section 8.2; the setup follows
# examples/channel_retau180 (the DNS at Re_tau = 180).
#
# Physics: walls at y = 0 and y = 2h, periodic in x and z, the box
# 2 pi h x 2h x pi h of MKM at Re_tau = 395. Units h = 1, bulk density and
# velocity 1, held by [source] mass_flow, so Re_b = 2 h U_b / nu = 13,764 as
# in MKM (U_b+ = 17.54) and Re_tau comes out of the run. Bulk Mach 0.2,
# isothermal walls at the bulk temperature, Pr = 0.72.
#
# LES: Sigma model with Scotti's filter width (the 3D default), hybrid KEEP
# / HLLC flux (central everywhere: there are no shocks), MUSCL without
# limiter. 64^3 hexahedra, tanh-stretched in y: dx+ = 39, dz+ = 19, dy+ =
# 0.9 at the wall and 31 at the center.
#
# Results, averaged over t = 100-300 h/U_b (11-12 h/u_tau), both halves
# folded, resolved fluctuations (MKM in parentheses); the middle columns
# use filter_width = "volume", Delta = V^(1/3):
#
#                        Sigma          Sigma, V^(1/3)  V^(1/3), C = 1.8  no model
#   Re_tau (392.2)       394.8 +0.7%    402.3 +2.6%     389.4 -0.7%       420.1 +7.1%
#   Cf (0.00650)         +0.9%          +4.8%           -1.9%             +14.2%
#   U+ at y+ = 30 (13.49)  13.40        13.10           13.68             12.27
#   U+ at y+ = 100 (16.53) 16.61        16.24           16.98             15.16
#   peak u_rms+ (2.74)   2.81           2.80            2.87              2.73
#   peak v_rms+ (1.00)   0.88           0.89            0.85              0.97
#   peak w_rms+ (1.29)   1.21           1.25            1.21              1.33
#   peak -u'v'+ (0.84)   0.79           0.81            0.78              0.85
#   dissipation: numerical / SGS / molecular
#                        3.1 / 14.9 / 82.0%   3.5 / 12.6 / 83.9%   2.8 / 16.6 / 80.6%   5.0 / 0 / 95.0%
#
# The model brings Re_tau within 1% of MKM where the model-off run is 7%
# high, and the mean profile within 1% for y+ = 30-300; v_rms is 12% low
# (the resolved part only, at dx+ = 39; 8% low with dx+ = 26, dz+ = 13). The numerical dissipation of the
# hybrid flux is 3-5% of the total. With HLLC everywhere instead (Sigma
# C = 1.8) the scheme dissipates 2.5 times as much as the model and Re_tau
# comes out 19% low. On 48^3 (dx+ = 52, dz+ = 26): Sigma C = 1.8 gives
# Re_tau = 381.3 (-2.8%), no model 405.3 (+3.3%).
#
# Run:
#   python ../../tools/channel_init.py input.toml init.restart
#   ../../build3d/src/Mallard -i input.toml
#   python ../../tools/plane_average.py stats/channel_<last>.vtu --average x z --out profile.csv
#   python ../../tools/plot_channel.py input.toml profile.csv forces_bottom.csv forces_top.csv \
#       --t-start 100 --retau 395
#
# Cost: 857,000 steps of 3.5e-4 h/U_b (acoustic CFL at the wall cells),
# 4.5 ms each on one A100: 65 minutes.

[run]
t_stop = 300.0
cfl = 0.9

[mesh]
type = "cartesian"
Nx = 64
Ny = 64
Nz = 64
Lx = 6.283185307179586
Ly = 2.0
Lz = 3.141592653589793
stretching = [0.0, 2.5, 0.0]
periodic = ["x", "z"]

[initialize]
type = "restart"
file = "init.restart"

[[boundaries]]
name = "bottom"
type = "wall_isothermal"
T = 1.0

[[boundaries]]
name = "top"
type = "wall_isothermal"
T = 1.0

[source]
mass_flow = [1.0, 0.0, 0.0]

[numerics]
riemann_solver = "HLLC"
convective_flux = "hybrid"
time_integrator = "SSPRK3"
check_nan = true

[numerics.face_reconstruction]
type = "MUSCL"
limiter = "none"

[physics]
type = "navier_stokes"
gamma = 1.4
p_ref = 17.857142857142858
T_ref = 1.0
rho_ref = 1.0
mu = 1.4531172e-4
Pr = 0.72

[les]
model = "sigma"

[statistics]
fields = ["RHO", "U_X", "U_Y", "U_Z", "P", "T"]
products = ["U_X*U_X", "U_Y*U_Y", "U_Z*U_Z", "U_X*U_Y"]
t_start = 100.0
interval = 10

[output]
check_interval = 5000

[integrals]
interval = 2000
budget = true

[[forces]]
zone = "bottom"
interval = 50
file = "forces_bottom.csv"

[[forces]]
zone = "top"
interval = 50
file = "forces_top.csv"

[[write_data]]
prefix = "./stats/channel"
format = "vtu"
time_interval = 50.0
variables = ["MEAN_*", "COV_*"]

[[write_data]]
prefix = "./restart/channel"
format = "restart"
interval = 50000
