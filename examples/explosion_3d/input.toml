# Spherical explosion (Toro, "Riemann Solvers and Numerical Methods for Fluid
# Dynamics", 3rd ed., section 17.1.3): a sphere of radius 0.4 at
# rho = 1, p = 1 in a gas at rho = 0.125, p = 0.1, run to t = 0.25. Only the
# octant [0, 1]^3 is computed, with symmetry planes at x = 0, y = 0 and z = 0
# and transmissive outer boundaries, on 64^3 hexahedra with TENO5. Needs the
# 3D build (cmake -DMallard_DIM=3).
#
# Run:
#   ../../build3d/src/Mallard -i input.toml --kokkos-num-threads=8
#
# Expected result at t = 0.25: an outgoing spherical shock near r = 0.80, a
# contact near r = 0.6 and a rarefaction running into the center, with density
# a function of r only (at 24^3 the spread within thin radial shells is about
# 1% of the mean). Set type = "cartesian_tet" for the same case on
# tetrahedra. About 5 minutes on 8 threads.

[run]
t_stop = 0.25
cfl = 0.5

[mesh]
type = "cartesian"
Nx = 64
Ny = 64
Nz = 64
Lx = 1.0
Ly = 1.0
Lz = 1.0

[initialize]
type = "analytical"
rho = "x^2 + y^2 + z^2 < 0.16 ? 1.0 : 0.125"
u = ["0.0", "0.0", "0.0"]
p = "x^2 + y^2 + z^2 < 0.16 ? 1.0 : 0.1"

[[boundaries]]
name = "left"
type = "symmetry"

[[boundaries]]
name = "bottom"
type = "symmetry"

[[boundaries]]
name = "back"
type = "symmetry"

[[boundaries]]
name = "right"
type = "extrapolation"

[[boundaries]]
name = "top"
type = "extrapolation"

[[boundaries]]
name = "front"
type = "extrapolation"

[numerics]
riemann_solver = "HLLC"
time_integrator = "SSPRK3"
check_nan = true

[numerics.face_reconstruction]
type = "TENO"
order = 5

[physics]
type = "euler"
gamma = 1.4
p_ref = 1.0
T_ref = 1.0
rho_ref = 1.0

[output]
check_interval = 20

[[write_data]]
prefix = "./solut/explosion"
format = "vtu"
time_interval = 0.025
variables = ["RHO", "U_X", "U_Y", "U_Z", "P"]
