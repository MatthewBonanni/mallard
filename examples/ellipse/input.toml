# Inviscid Mach 0.3 flow past an elliptic cylinder (semi-axes 0.5 and 0.25)
# with its wall projected onto the exact ellipse. The steady Euler solution
# has no drag and no entropy (d'Alembert); with straight faces the polygonal
# wall makes both. Generate the mesh first (128 x 48 quads in elliptic
# coordinates):
#   python ../../tools/mesh/make_cylinder_mesh.py ellipse.msh --aspect 0.5 --n-theta 128 --n-r 48 --r-far 20 --dr0 0.02
# Set [mesh] curved_geometry = false to see the same mesh with straight faces.
# Nondimensionalization: free-stream density and sound speed 1, so U = M = 0.3.

[run]
t_stop = 60.0
cfl = 0.8

[mesh]
type = "file"
filename = "ellipse.msh"

[[mesh.curved]]
zone = "cylinder"
type = "ellipse"
center = [0.0, 0.0]
semi_axes = [0.5, 0.25]

[initialize]
type = "analytical"
rho = "1.0"
u = ["0.3", "0.0"]
p = "0.7142857142857143"

[[boundaries]]
name = "cylinder"
type = "wall_adiabatic"

[[boundaries]]
name = "farfield"
type = "farfield"
u = [0.3, 0.0]
p = 0.7142857142857143
T = 0.7142857142857143

[numerics]
riemann_solver = "HLLC"
time_integrator = "SSPRK3"
check_nan = true

[numerics.face_reconstruction]
type = "TENO"
order = 4

[physics]
type = "euler"
gamma = 1.4
p_ref = 0.7142857142857143
T_ref = 0.7142857142857143
rho_ref = 1.0

[output]
check_interval = 2000

[[forces]]
zone = "cylinder"
interval = 20
file = "./solut/forces_cylinder.csv"

[[write_data]]
prefix = "./solut/ellipse"
time_interval = 10.0
variables = ["RHO", "U_X", "U_Y", "P"]

[[write_data]]
prefix = "./solut/wall"
geometry = "cylinder"
time_interval = 10.0
variables = ["P", "RHO"]
