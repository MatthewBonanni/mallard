# Inviscid flow past a prolate spheroid at Mach 0.3 (3D build), with the wall
# faces curved onto the analytic ellipsoid, against the same mesh with flat
# faces ([mesh] curved_geometry = false). The exact steady solution has no
# drag (d'Alembert) and uniform entropy, and its surface pressure is close to
# incompressible potential flow, Cp = 1 - (1 + k)^2 (1 - n_x^2) with
# k = 0.2100 for a 2:1 spheroid (Lamb, Hydrodynamics, ch. V; n is the wall
# normal): any drag and entropy rise are numerical errors, which flat facets
# make at the wall and the curved faces remove.
#
# At reduced size (compare_ellipsoid.py --scales 0.7 1 --t-stop 10), cells
# near the body:
#
#                         tetrahedra     Cd     entropy error   Cp error
#   curved faces            4,223     -0.0046     5.0e-4          0.044
#                          11,215     -0.0032     1.4e-4          0.025
#   flat faces              4,223      0.51       1.3e-2          1.96
#                          11,215      0.53       7.5e-3          1.75
#
# (entropy error: volume-weighted RMS of s / s_inf - 1 within the spheroid
# scaled by 3; Cp error: RMS against potential flow over the wall faces).
# Flat facets are corners for the inviscid flow: it turns unsteady, with local
# Mach numbers up to 0.9 and a quarter of the cells troubled; on the curved
# faces it stays steady, with a peak Mach number of 0.365 (potential flow: 0.363).
#
# Mesh: tetrahedra of the quarter y >= 0, z >= 0 of the box [-6, 8] x [-6, 6]^2
# (y = 0 and z = 0 are symmetry planes), spheroid of length 2 and diameter 1,
# 627,507 tetrahedra at --scale 4. Generate it first:
#   python make_ellipsoid_mesh.py ellipsoid.msh --scale 4
# Nondimensionalization: free-stream density and sound speed 1, so U = M = 0.3.
#
# Run, then compare with the flat faces:
#   ../../build3d/src/mallard -i input.toml
#   python compare_ellipsoid.py runs --mallard ../../build3d/src/mallard -o ellipsoid.png
# (compare_ellipsoid.py runs both geometries on meshes of the given scales and
# plots the drag, entropy error and wall pressure).
#
# Cost: on two loaded CPU threads, 15 us per cell and step; t = 10 on 11,215
# tetrahedra took 24 minutes (7,960 steps). Not yet run at full size: about
# 120,000 steps, estimated at 4-5 hours per geometry on one A100.

[run]
t_stop = 40.0
cfl = 0.4

[mesh]
type = "file"
filename = "ellipsoid.msh"

[[mesh.curved]]
zone = "ellipsoid"
type = "ellipsoid"
filled = false
center = [0.0, 0.0, 0.0]
semi_axes = [1.0, 0.5, 0.5]

[initialize]
type = "constant"
u = [0.3, 0.0, 0.0]
p = 0.7142857142857143
T = 0.7142857142857143

[[boundaries]]
name = "ellipsoid"
type = "wall_adiabatic"

[[boundaries]]
name = "inflow"
type = "farfield"
u = [0.3, 0.0, 0.0]
p = 0.7142857142857143
T = 0.7142857142857143

[[boundaries]]
name = "lateral"
type = "farfield"
u = [0.3, 0.0, 0.0]
p = 0.7142857142857143
T = 0.7142857142857143

[[boundaries]]
name = "outflow"
type = "farfield"
u = [0.3, 0.0, 0.0]
p = 0.7142857142857143
T = 0.7142857142857143

[[boundaries]]
name = "symmetry_y"
type = "symmetry"

[[boundaries]]
name = "symmetry_z"
type = "symmetry"

[numerics]
riemann_solver = "HLLC"
time_integrator = "SSPRK3"
check_nan = true

[numerics.face_reconstruction]
type = "TENO"
order = 5

[physics]
type = "euler"
gamma = 1.4
p_ref = 0.7142857142857143
T_ref = 0.7142857142857143
rho_ref = 1.0

[output]
check_interval = 500

[[forces]]
zone = "ellipsoid"
interval = 10
file = "./solut/forces_ellipsoid.csv"

[[write_data]]
prefix = "./solut/ellipsoid"
format = "vtu"
time_interval = 10.0
variables = ["RHO", "U", "P"]

# The wall and the meridian plane y = 0, often enough for an animation
[[write_data]]
prefix = "./solut/wall"
format = "vtu"
geometry = "ellipsoid"
time_interval = 0.25
variables = ["P"]

[[write_data]]
prefix = "./solut/y0"
format = "vtu"
geometry = "symmetry_y"
time_interval = 0.25
variables = ["RHO", "U", "P"]
