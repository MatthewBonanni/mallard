# Freely propagating stoichiometric H2/air flame at 300 K and 1 atm with
# mixture-averaged transport (V8 of docs/design/chemistry.md), in the flame's
# frame: the fresh mixture enters on the left at Cantera's flame speed, 2.3311
# m/s, and leaves through a pressure outlet. 300 cells, 20 per thermal
# thickness (0.328 mm), from 6 thicknesses upstream of the flame to 9
# downstream; two flame times. Make the initial state from Cantera's flame
# first, from this directory (flame_reference.py computes all twenty V8
# flames on fine grids, a few hours):
#
#   python ../../tools/setup/flame_reference.py reference full
#   python ../../tools/setup/flame_restart.py full/h2_phi1.0_mix_full.csv \
#       ../../mechanisms/h2o2.yaml ohmech 20 . --flame-times 2 --explicit-step
#
# then run and measure the flame speed with
#   mallard post flame solut/flame.vtkhdf --reference-speed 2.33108

[run]
t_stop = 0.00028170830959981072
cfl = 1.0

[mesh]
type = "cartesian"
Nx = 300
Ny = 1
Lx = 0.0049251941249829267
Ly = 0.00016417313749943088

[initialize]
type = "restart"
file = "flame.restart"

[[boundaries]]
name = "left"
type = "inlet_state"
u = [2.3311081981593231, 0.0]
p = 101325.0
T = 300
X = { "H2" = 0.29585798816568049, "O2" = 0.1479289940828403, "N2" = 0.55621301775147924 }

[[boundaries]]
name = "right"
type = "outlet_pressure"
p = 101325.0

[[boundaries]]
name = "bottom"
type = "symmetry"

[[boundaries]]
name = "top"
type = "symmetry"

[numerics]
riemann_solver = "HLLC"
time_integrator = "SSPRK3"

[numerics.face_reconstruction]
type = "MUSCL"

[physics]
type = "navier_stokes"
gas = "mixture"
mechanism = "../../mechanisms/h2o2.yaml"
phase = "ohmech"
transport = "mixture_averaged"

[chemistry]
rtol = 1.0e-6
atol = 1.0e-10
explicit_step = true

[output]
check_interval = 2000

[[write_data]]
prefix = "./solut/flame"
time_interval = 9.3902769866603569e-06
fields = ["RHO", "U_X", "P", "T", "HRR", "Y_*", "OMEGA_*"]
