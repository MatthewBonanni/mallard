# Turbulent channel flow at Re_tau = 180 (3D build): direct numerical
# simulation against Moser, Kim & Mansour, Phys. Fluids 11, 943 (1999),
# doi:10.1063/1.869966 (MKM; the method of Kim, Moin & Moser, J. Fluid Mech.
# 177, 133 (1987), doi:10.1017/S0022112087000892).
#
# Results, averaged over t = 120-320 h/U_b (12.9 h/u_tau) with [statistics]
# and the wall shear of [[forces]], both halves of the channel folded:
#
#                          this input          MKM
#   Re_tau                 180.8               178.1   (+1.5%)
#   Cf = 2 tau_w / U_b^2   0.00830             0.00814 (+2.0%)
#   U+ at y+ = 5, 10       4.80, 8.48          4.81, 8.52
#   U+ at y+ = 30, 100     13.76, 16.93        13.87, 17.15
#   U_c+                   18.13               18.30
#   peak u_rms+            2.645 at y+ = 15    2.658 at 15
#   peak v_rms+            0.851 at y+ = 53    0.836 at 52
#   peak w_rms+            1.102 at y+ = 36    1.087 at 35
#   peak -u'v'+            0.734 at y+ = 30    0.723 at 30
#
# The RMS peaks are within 2% of MKM. A second run, continued from a
# developed state and averaged over t = 365-560, gives Re_tau = 181.0, Cf
# +2.1% and the same peaks to 0.5%. Over the window Re_tau(t) from the wall
# shear, averaged over 1 h/u_tau, stays between 179 and 184, and its means
# on the two walls agree to 0.1%. The mean momentum balance
# mu dU/dy - rho <u'v'> = tau_w (1 - y/h) closes to 0.6% of tau_w.
#
# Physics: walls at y = 0 and y = 2h, periodic in x and z, the box
# 4 pi h x 2h x 4/3 pi h of MKM. Units h = 1, bulk density and velocity 1:
# the forcing holds the volume average of rho u at 1 ([source] mass_flow, a
# uniform body force adjusted at every stage, with its work f . u in the
# energy), so Re_b = 2 h U_b / nu = 5600 as in MKM (Re_tau 178) and Re_tau
# comes out of the run. Bulk Mach 0.2 (sound speed 5 at the walls): density
# varies by 0.5% and the flow is incompressible to that accuracy. The walls are
# isothermal at the bulk temperature, which removes the heat of viscous
# dissipation so the flow reaches a statistically steady state (adiabatic
# walls would heat the gas by 0.15% per h/u_tau without bound). Constant viscosity,
# Pr = 0.72. This is a DNS: no turbulence model.
#
# Mesh: 192 x 96 x 128 hexahedra (2.36M), uniform in x and z, tanh-stretched
# in y ([mesh] stretching). In wall units at the computed Re_tau = 180.8:
# dx+ = 11.8, dz+ = 5.9, dy+ = 0.88 at the wall (first cell center at
# y+ = 0.44) and 6.8 at the center.
#
# Convective flux: the kinetic-energy-preserving central flux
# (convective_flux = "hybrid"; the Riemann solver only where the compression
# sensor fires) on unlimited MUSCL states. [integrals] budget = true
# measures the scheme's dissipation of kinetic energy (eps_numerical in
# integrals.csv): 0.9% of the total, the rest molecular. With the Riemann
# solver (HLLC) at every face instead, the scheme removes about 7% of the
# dissipation, and the wall shear comes out 7% low (Re_tau 172.9) with the
# u_rms peak 9% high. The upwind dissipation sets that gap; each line below
# starts from the same developed state and averages over 12 h/u_tau:
#
#   HLLC, low-Mach correction off       Cf -23%   u_rms+ 3.34
#   HLLC (low-Mach cutoff 0.1)          Cf -6.8%  u_rms+ 2.89
#   HLLC, low-Mach cutoff 0.01          Cf -5.8%  u_rms+ 2.87
#   Roe instead of HLLC                 Cf -7.9%  u_rms+ 2.91
#   HLLC, 384 x 96 x 128 (dx+ 5.9)      Cf -5.5%  u_rms+ 2.82
#   HLLC, 192 x 96 x 256 (dz+ 3.0)      Cf -2.6%  u_rms+ 2.80
#   HLLC, 384 x 96 x 256                Cf -0.8%  u_rms+ 2.72, v, w, -u'v' within 2%
#   hybrid (this input)                 Cf +2.0%  u_rms+ 2.65
#
# so HLLC reaches MKM by halving both dx and dz, at about 5 times the GPU time
# of this input. Halving the time step changes nothing (to 1%).
#
# Run:
#   python ../../tools/channel_init.py input.toml init.restart
#   mpirun -n 2 ../../build3d/src/Mallard -i input.toml --kokkos-map-device-id-by=mpi_rank
#   python ../../tools/plane_average.py stats/channel_<last>.pvtu --average x z --out profile.csv
#   python ../../tools/plot_channel.py input.toml profile.csv forces_bottom.csv forces_top.csv --t-start 120 --t-end 320
#   python ../../tools/animate_channel.py input.toml frames/*.restart --out channel --u-tau 0.0643
# (frames: restart files every 500 steps of a continuation run, 120 of them
# for the 8-second animation)
#
# The initial state (a turbulent-like mean profile and a random
# divergence-free perturbation) breaks down to turbulence within about
# 1 h/u_tau; the wall shear settles by t = 80 h/U_b (5 h/u_tau, with
# h/u_tau = 15.6 h/U_b), and the statistics (restart-carried, so they survive
# restarts) average from t = 120.
#
# Cost: 6.56e-4 h/U_b per step (acoustic CFL at the wall cells), 489,000
# steps to t = 320 at 17 ms each on two A100s: 2.3 hours.

[run]
t_stop = 320.0
cfl = 0.9

[mesh]
type = "cartesian"
Nx = 192
Ny = 96
Nz = 128
Lx = 12.566370614359172
Ly = 2.0
Lz = 4.1887902047863905
stretching = [0.0, 1.7, 0.0]
periodic = ["x", "z"]

[initialize]
type = "restart"
file = "init.restart"

[[boundaries]]
name = "bottom"
type = "wall_isothermal"
T = 1.0

[[boundaries]]
name = "top"
type = "wall_isothermal"
T = 1.0

[source]
mass_flow = [1.0, 0.0, 0.0]

[numerics]
riemann_solver = "HLLC"
convective_flux = "hybrid"
time_integrator = "SSPRK3"
check_nan = true

[numerics.face_reconstruction]
type = "MUSCL"
limiter = "none"

[physics]
type = "navier_stokes"
gamma = 1.4
p_ref = 17.857142857142858
T_ref = 1.0
rho_ref = 1.0
mu = 3.5714285714285714e-4
Pr = 0.72

[statistics]
fields = ["RHO", "U_X", "U_Y", "U_Z", "P", "T"]
products = ["U_X*U_X", "U_Y*U_Y", "U_Z*U_Z", "U_X*U_Y"]
t_start = 120.0
interval = 10

[integrals]
interval = 100
budget = true

[output]
check_interval = 1000

[[forces]]
zone = "bottom"
interval = 50
file = "forces_bottom.csv"

[[forces]]
zone = "top"
interval = 50
file = "forces_top.csv"

[[write_data]]
prefix = "./stats/channel"
format = "vtu"
time_interval = 40.0
variables = ["MEAN_*", "COV_*"]

[[write_data]]
prefix = "./restart/channel"
format = "restart"
time_interval = 20.0
