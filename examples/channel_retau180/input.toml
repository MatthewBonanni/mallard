# Turbulent channel flow at Re_tau = 180 (3D build): direct numerical
# simulation against Moser, Kim & Mansour, Phys. Fluids 11, 943 (1999),
# doi:10.1063/1.869966 (MKM; the method of Kim, Moin & Moser, J. Fluid Mech.
# 177, 133 (1987), doi:10.1017/S0022112087000892).
#
# Results, averaged over t = 120-320 h/U_b (12.3 h/u_tau) with [statistics]
# and the wall shear of [[forces]], both halves of the channel folded:
#
#                          this input          MKM
#   Re_tau                 172.6               178.1   (-3.1%)
#   Cf = 2 tau_w / U_b^2   0.00757             0.00814 (-7.0%)
#   U+ at y+ = 5, 10       4.84, 8.74          4.81, 8.52
#   U+ at y+ = 30, 100     14.74, 17.90        13.87, 17.15
#   U_c+                   18.81               18.30
#   peak u_rms+            2.88 at y+ = 16     2.66 at 15
#   peak v_rms+            0.80 at y+ = 58     0.84 at 52
#   peak w_rms+            1.05 at y+ = 34     1.09 at 35
#   peak -u'v'+            0.714 at y+ = 34    0.723 at 30
#
# The viscous sublayer matches; the near-wall streaks (u_rms) are 8% too
# strong and v_rms, w_rms 3-4% too weak, so the turbulent momentum transfer,
# and with it the wall shear, comes out low and U+ beyond y+ = 10 lies about
# 0.8 above MKM: the signature of a slightly under-resolved second-order DNS.
# Averaging to t = 240 instead gives Re_tau = 172.1 and the same peaks to 2%.
# Over the window Re_tau(t) from the wall shear varies between 168 and 178,
# and its means on the two walls agree to 0.1%.
#
# Physics: walls at y = 0 and y = 2h, periodic in x and z, the box
# 4 pi h x 2h x 4/3 pi h of MKM. Units h = 1, bulk density and velocity 1:
# the forcing holds the volume average of rho u at 1 ([source] mass_flow, a
# uniform body force adjusted at every stage, with its work f . u in the
# energy), so Re_b = 2 h U_b / nu = 5600 as in MKM (Re_tau 178) and Re_tau
# comes out of the run. Bulk Mach 0.2 (sound speed 5 at the walls): density
# varies by 0.5% and the flow is incompressible to that accuracy. The walls are
# isothermal at the bulk temperature, which removes the heat of viscous
# dissipation so the flow reaches a statistically steady state (adiabatic
# walls would heat the gas by 0.15% per h/u_tau without bound). Constant viscosity,
# Pr = 0.72. Mallard's low-Mach correction of the convective flux is on (the
# default, cutoff 0.1): it scales the upwind dissipation of velocity jumps
# with the flow speed instead of the sound speed. This is a DNS: no
# turbulence model, and no claim of an implicit LES.
#
# Mesh: 192 x 96 x 128 hexahedra (2.36M), uniform in x and z, tanh-stretched
# in y ([mesh] stretching). In wall units at the computed Re_tau = 172.6:
# dx+ = 11.3, dz+ = 5.6, dy+ = 0.84 at the wall (first cell center at
# y+ = 0.42) and 6.5 at the center. MUSCL without limiter and HLLC, for its
# cost: from the same developed state at t = 31, TENO3 (2.4 times the cost
# per step, plus 2 minutes of setup) gave the same wall shear to 2% over the
# next 10 h/U_b, and so did a low-Mach cutoff of 0.01.
#
# Run:
#   python ../../tools/channel_init.py input.toml init.restart
#   mpirun -n 4 ../../build3d/src/Mallard -i input.toml --kokkos-map-device-id-by=mpi_rank
#   python ../../tools/plane_average.py stats/channel_<last>.pvtu --average x z --out profile.csv
#   python ../../tools/plot_channel.py input.toml profile.csv forces_bottom.csv forces_top.csv --t-start 120 --t-end 320
#   python ../../tools/animate_channel.py input.toml frames/*.restart --out channel --u-tau 0.0614
# (frames: restart files every 500 steps of a continuation run, 120 of them
# for the 8-second animation)
#
# The initial state (a turbulent-like mean profile and a random
# divergence-free perturbation) breaks down to turbulence within about
# 1 h/u_tau; the wall shear settles by t = 80 h/U_b (5 h/u_tau, with
# h/u_tau = 16.3 h/U_b), and the statistics (restart-carried, so they survive
# restarts) average from t = 120.
#
# Cost: 3.28e-4 h/U_b per step (acoustic CFL at the wall cells), 978,000
# steps to t = 320 at 17-19 ms each on four A100s: 5 hours.

[run]
t_stop = 320.0
cfl = 0.45

[mesh]
type = "cartesian"
Nx = 192
Ny = 96
Nz = 128
Lx = 12.566370614359172
Ly = 2.0
Lz = 4.1887902047863905
stretching = [0.0, 1.7, 0.0]
periodic = ["x", "z"]

[initialize]
type = "restart"
file = "init.restart"

[[boundaries]]
name = "bottom"
type = "wall_isothermal"
T = 1.0

[[boundaries]]
name = "top"
type = "wall_isothermal"
T = 1.0

[source]
mass_flow = [1.0, 0.0, 0.0]

[numerics]
riemann_solver = "HLLC"
time_integrator = "SSPRK3"
check_nan = true

[numerics.face_reconstruction]
type = "MUSCL"
limiter = "none"

[physics]
type = "navier_stokes"
gamma = 1.4
p_ref = 17.857142857142858
T_ref = 1.0
rho_ref = 1.0
mu = 3.5714285714285714e-4
Pr = 0.72

[statistics]
fields = ["RHO", "U_X", "U_Y", "U_Z", "P", "T"]
products = ["U_X*U_X", "U_Y*U_Y", "U_Z*U_Z", "U_X*U_Y"]
t_start = 120.0
interval = 10

[output]
check_interval = 1000

[[forces]]
zone = "bottom"
interval = 50
file = "forces_bottom.csv"

[[forces]]
zone = "top"
interval = 50
file = "forces_top.csv"

[[write_data]]
prefix = "./stats/channel"
format = "vtu"
time_interval = 40.0
variables = ["MEAN_*", "COV_*"]

[[write_data]]
prefix = "./restart/channel"
format = "restart"
interval = 10000
