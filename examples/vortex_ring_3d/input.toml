# A vortex ring and its azimuthal (Widnall) instability (3D build).
#
# A Gaussian vortex ring (core radius a = 0.2 R, Re = Gamma / 2 pi nu = 5000,
# peak swirl Mach 0.3) in a periodic box of 4.8 R, held in place by a uniform
# background flow against its self-induced speed. vortex_ring.py table writes
# the axisymmetric ring (ring.csv: streamfunction and pressure in equilibrium);
# the input reads it in 3D at a core displaced by 3e-4 R in every azimuthal
# mode n = 1..24, and the elliptic instability picks the modes near
# n = 2.33 R / a. TENO3, HLLC and SSPRK3 on 192^3 hexahedra (a / 8).
#
#   python vortex_ring.py table input.toml ring.csv
#   mpirun -n 8 ../../build3d/src/mallard -i input.toml       (OMP_NUM_THREADS=15)
#   python vortex_ring.py modes input.toml restart/ring_*.restart --csv modes.csv --planes planes.npz
#   python vortex_ring.py compare input.toml modes.csv --planes planes.npz --png ring.png
#
# 7,077,888 cells and 17,037 steps to t = 95.73 (9 t_ring = 9 x 2 pi R^2 / Gamma):
# 4.2 hours on 120 CPU threads (8 ranks x 15), 827 ms per step, of which the
# analytical initial state takes 15 minutes.
#
# RESULTS: n = 11 grows fastest and dominates (theory: n = 2.33 / eps = 10.6 at
# eps = a / R = 0.22). Fitted over t = 30-70, its growth rate is
# sigma 2 pi R^2 / Gamma = 0.909, 1.04 times the viscous theory (0.877;
# inviscid 0.929); over t = 20-50 and 25-60 it is 1.06 and 1.04 times theory,
# over the early t = 20-35 1.14. The rate is not grid-converged: coarse.toml
# (144^3) gives rates 15-20% lower in every window (0.773 over t = 30-70),
# falling as the window moves later, with a core that grows faster (a = 0.237
# against 0.225 at t = 63.8) from the coarser mesh's numerical dissipation.

[run]
t_stop = 95.73
cfl = 0.8

[mesh]
type = "cartesian"
Nx = 192
Ny = 192
Nz = 192
Lx = 4.8
Ly = 4.8
Lz = 4.8

[[periodic]]
zones = ["left", "right"]

[[periodic]]
zones = ["bottom", "top"]

[[periodic]]
zones = ["back", "front"]

# The ring from its table (x, r: ux, q = u_r / r, p), with the background flow
# that holds it in place; isentropic density
[initialize]
type = "analytical"
rho = "(ring_p / 0.7142857142857143)^(1 / 1.4)"
p = "ring_p"
u = ["ring_ux - 0.1471739010081762", "ring_q * (y - 2.4)", "ring_q * (z - 2.4)"]

# Seed: the table is read at a displaced core, by 3e-4 R in x and in r for each
# azimuthal mode n = 1..24, with incommensurate phases (n^2 times the golden
# ratio and sqrt(2), modulo 1)
[[initialize.data]]
name = "ring"
file = "ring.csv"
interpolation = "cubic"
coordinates = ["x", "r"]
at = [
    """\
    var th := atan2(z - 2.4, y - 2.4); var d := 0; \
    for (var n := 1; n <= 24; n += 1) { d += cos(n * th + 2 * pi * frac(0.6180339887 * n * n)) }; \
    x - 3e-4 * d""",
    """\
    var th := atan2(z - 2.4, y - 2.4); var d := 0; \
    for (var n := 1; n <= 24; n += 1) { d += cos(n * th + 2 * pi * frac(0.4142135624 * n * n)) }; \
    hypot(y - 2.4, z - 2.4) - 3e-4 * d""",
]

[numerics]
riemann_solver = "HLLC"
time_integrator = "SSPRK3"

[numerics.face_reconstruction]
type = "TENO"
order = 3

[physics]
type = "navier_stokes"
units = "nondimensional"
gamma = 1.4
p_ref = 0.7142857142857143
T_ref = 0.7142857142857143
rho_ref = 1.0
mu = 1.880288310874334e-5
Pr = 0.71

[output]
check_interval = 200

[integrals]
interval = 20
file = "integrals.csv"

[[write_data]]
prefix = "./restart/ring"
format = "restart"
time_interval = 2.659166666666667
