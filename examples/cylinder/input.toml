# Flow past a circular cylinder at Re = 100, Mach 0.2: periodic vortex
# shedding (Karman vortex street). On this mesh, over t = 60..160:
# St = 0.164, mean Cd = 1.36, lift amplitude 0.33 (references for
# incompressible flow: St 0.164-0.166, Cd 1.33-1.35, Cl' 0.33).
# Generate the mesh first (384 x 128 quads):
#   python ../../tools/mesh/make_cylinder_mesh.py cylinder.msh --n-theta 384 --n-r 128 --r-far 25 --dr0 0.01
# Nondimensionalization: cylinder diameter 1, free-stream density and sound
# speed 1, so U = M = 0.2 and mu = U D / Re.

[run]
t_stop = 160.0
cfl = 1.0

[mesh]
type = "file"
filename = "cylinder.msh"

[initialize]
type = "analytical"
rho = "1.0"
# A transverse kick behind the cylinder: shedding saturates by t = 60
# (the instability e-folds only every ~50 time units)
u = ["0.2 * (1 - exp(-4 * (x^2 + y^2 - 0.25)))",
     "0.1 * exp(-((x - 1.5)^2 + y^2))"]
p = "0.7142857142857143"

[[boundaries]]
name = "cylinder"
type = "wall_adiabatic"

[[boundaries]]
name = "farfield"
type = "farfield"
u = [0.2, 0.0]
p = 0.7142857142857143
T = 0.7142857142857143

[numerics]
riemann_solver = "HLLC"
time_integrator = "SSPRK3"
check_nan = true

[numerics.face_reconstruction]
type = "TENO"
order = 3

[physics]
type = "navier_stokes"
gamma = 1.4
p_ref = 0.7142857142857143
T_ref = 0.7142857142857143
rho_ref = 1.0
mu = 0.002
Pr = 0.72

[output]
check_interval = 2000

[[forces]]
zone = "cylinder"
interval = 20
file = "./solut/forces_cylinder.csv"

[[write_data]]
prefix = "./solut/cylinder"
time_interval = 1.0
variables = ["RHO", "U_X", "U_Y", "P"]

[[write_data]]
prefix = "./solut/wall"
region = "cylinder"
time_interval = 1.0
variables = ["P"]

# Often, and small: the near wake's cells (with their REGION_FRACTION), and
# three cuts across the recirculation bubble at x = 1.0, 1.4 and 1.8 (point
# values of the TENO polynomials: solut/wake_0.vtkhdf, _1, _2), ten times per
# shedding period
[[write_data]]
prefix = "./solut/near_wake"
region = {type = "rectangle", center = [3.0, 0.0], size = [6.0, 3.0]}
time_interval = 0.6
variables = ["RHO", "U", "P", "VORTICITY"]

[[write_data]]
prefix = "./solut/wake"
regions = [{type = "cut_plane", point = [1.0, 0.0], normal = [1.0, 0.0], bounds = [[0.9, -2.0], [1.1, 2.0]]},
           {type = "cut_plane", point = [1.4, 0.0], normal = [1.0, 0.0], bounds = [[1.3, -2.0], [1.5, 2.0]]},
           {type = "cut_plane", point = [1.8, 0.0], normal = [1.0, 0.0], bounds = [[1.7, -2.0], [1.9, 2.0]]}]
time_interval = 0.6
variables = ["U", "P", "MASS_FLUX"]

# Transverse velocity two diameters behind the cylinder (its spectrum gives
# St), point values of the TENO polynomials every 0.1 time units
[[probes]]
name = "wake_point"
variables = ["U_Y", "P"]
sampling = "point"
point = [2.5, 0.0]
time_interval = 0.1
file = "./solut/probe_wake_point.csv"

# Wake survey on an arc of radius 5 behind the cylinder (ParaView reads the
# .pvd series), with its mean and RMS each time unit
[[probes]]
name = "wake_arc"
variables = ["U", "P"]
sampling = "point"
type = "arc"
center = [0.0, 0.0]
radius = 5.0
angles = [-45.0, 45.0]
n_points = 91
time_interval = 1.0
format = "vtp"
file = "./solut/probe_wake_arc.pvd"
reductions = ["mean", "rms", "min", "max"]
reductions_file = "./solut/probe_wake_arc_reductions.csv"

# Wall pressure and skin friction coefficients around the cylinder, ordered
# along the wall (clockwise, with the arc length s from the first face)
[[probes]]
name = "wall"
boundary = "cylinder"
variables = ["CP", "CF", "Y_PLUS"]
reference = {rho = 1.0, u = [0.2, 0.0], p = 0.7142857142857143}
time_interval = 1.0
file = "./solut/probe_wall.csv"

# Phase averages of the shedding cycle from t = 60, in 12 bins of the phase
# set by the upward zero crossings of U_Y on the wake axis at x = 3: the
# PHASE_<bin>_<field> output of the last snapshot. Over t = 100..400 the
# crossings give St = 0.1651 (period 30.29 +- 0.05), the bins equal the
# probe series binned by tools/post/insitu_statistics.py phase bitwise, and the
# phase-averaged U_Y at the probe keeps 0.991 of the signal's amplitude (a
# sinusoid averaged over 1/12 of a period keeps 0.989): no phase jitter.
[statistics]
t_start = 60.0
interval = 10

[statistics.phase]
fields = ["U_X", "U_Y", "P"]
bins = 12
probe = [3.0, 0.0]
variable = "U_Y"
level = 0.0

[[write_data]]
prefix = "./solut/phase"
time_interval = 100.0
variables = ["PHASE_*"]
