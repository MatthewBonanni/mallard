# Flow past a circular cylinder at Re = 100, Mach 0.2: periodic vortex
# shedding (Karman vortex street). On this mesh, over t = 60..160:
# St = 0.164, mean Cd = 1.36, lift amplitude 0.33 (references for
# incompressible flow: St 0.164-0.166, Cd 1.33-1.35, Cl' 0.33).
# Generate the mesh first (384 x 128 quads):
#   python ../../tools/make_cylinder_mesh.py cylinder.msh --n-theta 384 --n-r 128 --r-far 25 --dr0 0.01
# Nondimensionalization: cylinder diameter 1, free-stream density and sound
# speed 1, so U = M = 0.2 and mu = U D / Re.

[run]
t_stop = 160.0
cfl = 1.0

[mesh]
type = "file"
filename = "cylinder.msh"

[initialize]
type = "analytical"
rho = "1.0"
# A transverse kick behind the cylinder: shedding saturates by t = 60
# (the instability e-folds only every ~50 time units)
u = ["0.2 * (1 - exp(-4 * (x^2 + y^2 - 0.25)))",
     "0.1 * exp(-((x - 1.5)^2 + y^2))"]
p = "0.7142857142857143"

[[boundaries]]
name = "cylinder"
type = "wall_adiabatic"

[[boundaries]]
name = "farfield"
type = "farfield"
u = [0.2, 0.0]
p = 0.7142857142857143
T = 0.7142857142857143

[numerics]
riemann_solver = "HLLC"
time_integrator = "SSPRK3"
check_nan = true

[numerics.face_reconstruction]
type = "TENO"
order = 3

[physics]
type = "navier_stokes"
gamma = 1.4
p_ref = 0.7142857142857143
T_ref = 0.7142857142857143
rho_ref = 1.0
mu = 0.002
Pr = 0.72

[output]
check_interval = 2000

[[forces]]
zone = "cylinder"
interval = 20
file = "./solut/forces_cylinder.csv"

[[write_data]]
prefix = "./solut/cylinder"
format = "vtu"
time_interval = 1.0
variables = ["RHO", "U_X", "U_Y", "P"]

[[write_data]]
prefix = "./solut/wall"
format = "vtu"
geometry = "cylinder"
time_interval = 1.0
variables = ["P"]
