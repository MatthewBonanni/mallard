# The Taylor-Green vortex of input.toml on 32^3 hexahedra of the periodic
# box, continued from the 16^3 run of coarse.toml at t = 3: its restart file
# remapped conservatively with degree-3 polynomials (no limiter, the field is
# smooth). The file is the restart that coarse.toml ends with (step 239).
# Needs the 3D build.
#
#   python ../../tools/docs/remap_tgv.py fine/integrals.csv coarse/integrals.csv remap/integrals.csv
#
# with fine/ from input.toml at Nx = 32 to t = 10, for the figure of
# docs/design/remap.md.
#
# Expected result: the remap takes 0.6 s on 2 CPU threads and keeps mass,
# momentum and energy to 4e-14. By t = 3 the 16^3 run dissipates 3x as fast
# as the 32^3 run and has lost 10% more kinetic energy. On the finer mesh
# the dissipation drops at once, below the 32^3 run's (two thirds of it: the
# coarse run has already damped the small scales), then catches up: its peak
# is 7% lower and later (0.0116 at t = 6.6 against 0.0124 at t = 6.0), and from
# t = 7 it stays within 6% of the 32^3 run's. Both meshes are far coarser than
# the workshop's 128^3 (the DNS peak is at t = 9). 32^3 from t = 3 to 10:
# 1,118 steps, 7 minutes on 2 threads.

[run]
t_stop = 10.0
cfl = 1.0

[mesh]
type = "cartesian"
Nx = 32
Ny = 32
Nz = 32
Lx = 6.283185307179586
Ly = 6.283185307179586
Lz = 6.283185307179586
periodic = ["x", "y", "z"]

[initialize]
type = "remap"
file = "coarse/tgv_000239.restart"
degree = 3
limiter = "none"

[initialize.mesh]
type = "cartesian"
Nx = 16
Ny = 16
Nz = 16
Lx = 6.283185307179586
Ly = 6.283185307179586
Lz = 6.283185307179586
periodic = ["x", "y", "z"]

[numerics]
riemann_solver = "HLLC"
time_integrator = "SSPRK3"
check_nan = true

[numerics.face_reconstruction]
type = "TENO"
order = 5

[physics]
type = "navier_stokes"
gamma = 1.4
p_ref = 71.42857142857143
T_ref = 1.0
rho_ref = 1.0
mu = 0.000625
Pr = 0.71

[output]
check_interval = 500

[integrals]
interval = 5
file = "remap/integrals.csv"

[[write_data]]
prefix = "./remap/tgv"
format = "restart"
interval = 2000
