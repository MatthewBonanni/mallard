# Coarse start of the Taylor-Green vortex (input.toml) for a run on a finer
# mesh: the periodic box on 16^3 hexahedra up to t = 3, while the vortex
# sheets are still forming; the restart file it ends with initializes
# remap.toml (32^3). Needs the 3D build. 239 steps: 8 s on 2 CPU threads.
#
#   ../../build3d/src/mallard -i coarse.toml --kokkos-num-threads=2
#   ../../build3d/src/mallard -i remap.toml --kokkos-num-threads=2

[run]
t_stop = 3.0
cfl = 1.0

[mesh]
type = "cartesian"
Nx = 16
Ny = 16
Nz = 16
Lx = 6.283185307179586
Ly = 6.283185307179586
Lz = 6.283185307179586

[[periodic]]
zones = ["left", "right"]

[[periodic]]
zones = ["bottom", "top"]

[[periodic]]
zones = ["back", "front"]

[initialize]
type = "analytical"
u = ["sin(x) * cos(y) * cos(z)", "-cos(x) * sin(y) * cos(z)", "0.0"]
p = "71.42857142857143 + (cos(2 * x) + cos(2 * y)) * (cos(2 * z) + 2) / 16"
T = "1.0"

[numerics]
riemann_solver = "HLLC"
time_integrator = "SSPRK3"
check_nan = true

[numerics.face_reconstruction]
type = "TENO"
order = 5

[physics]
type = "navier_stokes"
gamma = 1.4
p_ref = 71.42857142857143
T_ref = 1.0
rho_ref = 1.0
mu = 0.000625
Pr = 0.71

[output]
check_interval = 500

[integrals]
interval = 5
file = "coarse/integrals.csv"

[[write_data]]
prefix = "./coarse/tgv"
format = "restart"
interval = 1000000
