# Non-reacting LES of the Volvo bluff-body combustor (3D build): Sjunnesson,
# Nelsson & Max 1991 (LDA), the configuration of the AIAA Model Validation for
# Propulsion workshop. Design and results: docs/design/les.md, section 8.3.
#
# Physics: air at 288 K and 1 atm enters a channel of height H = 3 D = 0.12 m
# at U_b = 16.6 m/s (Re_D = 45,000 with Sutherland's viscosity) and passes an
# equilateral triangle of edge D = 0.04 m, apex upstream, base at x = 0. The
# rig is 6 D wide; here the span is periodic over 2 D = 0.08 m, as in the
# workshop's computations. Inlet 5 D upstream of the base (nscbc_inlet with
# digital-filter turbulence: u' = 5% U_b, isotropic, integral length 10 mm),
# outlet 17 D downstream (the rig's exit; nscbc_outlet), no-slip adiabatic
# walls (channel walls and bluff body, not wall-resolved: no wall model).
#
# LES: Sigma model with Scotti's filter width, hybrid KEEP / HLLC flux, MUSCL
# without limiter, SSPRK3. Mesh (tools/make_volvo_mesh.py --ds 1.25e-3 --nz 64):
# 2.7M hexahedra, Delta = 1.25 mm = D / 32 in the shear layers and the near
# wake (x < 5 D), 0.6 mm at the separation corners, growing to 5 mm at
# x = 10 D and 10 mm at the outlet; dz = 1.25 mm. The mesh lines leave the
# slanted faces normally: with 60-degree wall cells there the central flux
# grew grid-scale velocity to Mach 0.4-0.8.
#
# Results, statistics over t = 0.08-0.30 s (26 shedding periods), averaged
# over the span, against the LDA data (reference/, digitized from Wu et al.
# 2017):
#   recirculation length L_r / D        1.34 (experiment 1.35)
#   centerline minimum U / U_b          -0.59 at x/D = 0.61 (-0.64 at 0.75)
#   mean |U - U_exp| / U_b at x/D = 0.375 / 0.95 / 1.53 / 3.75 / 9.4
#                                       0.13 / 0.14 / 0.11 / 0.07 / 0.08
#   mean |u' - u'_exp| / U_b            0.05 / 0.08 / 0.08 / 0.05 / 0.06
#   shedding frequency                  118 Hz (St = 0.285)
#   eps_num / eps_sgs                   -0.38 (numerical / SGS / molecular
#                                       shares -52 / 135 / 17%: the scheme
#                                       feeds energy, the model removes it)
#
# Run:
#   python ../../tools/make_volvo_mesh.py volvo.msh --ds 1.25e-3 --nz 64
#   python ../../tools/volvo.py probes >> cold.toml   # optional: mid-span plane for a movie
#   mpirun -n 4 ../../build3d/src/Mallard -i cold.toml --kokkos-map-device-id-by=mpi_rank
#   python ../../tools/volvo.py profiles stats/cold_000003.pvtu --u-bulk 16.6 --out cold.npz
#   python ../../tools/volvo.py plot cold.npz --exp reference --out cold.png
#   python ../../tools/volvo.py budget integrals.csv --t0 0.08
# Cost: 626,000 steps, 14 ms each on four A100s (2.8 hours).

[run]
t_stop = 0.3
cfl = 0.8

[mesh]
type = "file"
filename = "volvo.msh"

[[periodic]]
zones = ["back", "front"]
translation = [0.0, 0.0, 0.08]

[initialize]
type = "constant"
u = [16.6, 0.0, 0.0]
p = 101325.0
T = 288.0

[[boundaries]]
name = "inlet"
type = "nscbc_inlet"
u = [16.6, 0.0, 0.0]
p = 101325.0
T = 288.0
L = 0.88

[boundaries.turbulence]
reynolds_stress = [0.6889, 0.6889, 0.6889, 0.0, 0.0, 0.0]
length_scale = 0.01

[[boundaries]]
name = "outlet"
type = "nscbc_outlet"
p = 101325.0
L = 0.88

[[boundaries]]
name = "top"
type = "wall_adiabatic"

[[boundaries]]
name = "bottom"
type = "wall_adiabatic"

[[boundaries]]
name = "bluffbody"
type = "wall_adiabatic"

[numerics]
riemann_solver = "HLLC"
convective_flux = "hybrid"
time_integrator = "SSPRK3"
check_nan = true

[numerics.face_reconstruction]
type = "MUSCL"
limiter = "none"

[physics]
type = "navier_stokes"
gamma = 1.4
p_ref = 101325.0
T_ref = 288.0
rho_ref = 1.2256836
viscosity_model = "sutherland"
mu = 1.716e-5
Pr = 0.71

[les]
model = "sigma"

[statistics]
fields = ["RHO", "U_X", "U_Y", "U_Z", "P"]
products = ["U_X*U_X", "U_Y*U_Y", "U_Z*U_Z", "U_X*U_Y"]
t_start = 0.08
interval = 5

[integrals]
interval = 5
budget = true

[output]
check_interval = 2000

[[write_data]]
prefix = "restart/cold"
format = "restart"
time_interval = 0.02

[[write_data]]
prefix = "stats/cold"
format = "vtu"
time_interval = 0.1
variables = ["MEAN_*", "COV_*", "MU_T"]

[[write_data]]
prefix = "snap/cold"
format = "vtu"
time_interval = 0.15
variables = ["U", "Q", "MU_T"]
