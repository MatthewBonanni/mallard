    - [7.5341368, 0.018872239, -6.2718491e-06, 9.1475649e-10, -4.7838069e-14, -16467.516, -17.892349]
    note: L4/85
  transport: {model: gas, geometry: nonlinear, diameter: 4.982, well-depth: 266.8, rotational-relaxation: 1.0}
- name: O2
