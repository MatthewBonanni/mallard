# Two-step global propane-air mechanism for LES of lean premixed flames
# (examples/volvo_bluff_body). Form of Westbrook & Dryer (1981, Combust. Sci.
# Technol. 27, 31, doi:10.1080/00102208108946970), quasi-global propane with CO
# oxidation:
#   C3H8 + 3.5 O2 => 3 CO + 4 H2O   rate A [C3H8]^0.1 [O2]^1.65 exp(-30 kcal/mol / RT)
#   CO + 0.5 O2 (+ H2O) => CO2      10^14.6 [CO] [H2O]^0.5 [O2]^0.25 exp(-40 kcal/mol / RT)
#   CO2 => CO + 0.5 O2              5e8 [CO2] exp(-40 kcal/mol / RT)
# H2O appears on both sides of the second step so that its order can be given
# (Cantera and Mallard take orders of reactants only); it is not consumed.
# The first step's A = 1.48e12 (cm, mol, s) is tuned so that the laminar flame
# at phi = 0.65, 288 K, 1 atm (mixture-averaged transport) matches GRI-Mech 3.0
# (Cantera 3.2): s_L = 0.209 m/s (GRI 0.209), T_b = 1766 K (GRI 1792, -1.4%),
# thermal thickness (T_b - T_u) / max dT/dx = 0.471 mm (GRI 0.552). Species
# thermodynamics and transport data are those of gri30.yaml (Cantera 3.2.0,
# BSD-3-Clause, see README.md).
units: {length: cm, time: s, quantity: mol, activation-energy: cal/mol}
phases:
- name: c3h8_2step
  thermo: ideal-gas
  elements: [O, H, C, N]
  species: [C3H8, O2, CO, CO2, H2O, N2]
  kinetics: gas
  transport: mixture-averaged
  state: {T: 300.0, P: 101325.0}
species:
- name: C3H8
  composition: {C: 3.0, H: 8.0}
  thermo:
    model: NASA7
    temperature-ranges: [300.0, 1000.0, 5000.0]
