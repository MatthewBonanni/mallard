# Case templates for `Mallard new`.
#
# Each [[templates]] entry points at an example (or tutorial) directory;
# `Mallard new` assembles the case from its files when it is created, so a
# template is always its example. The keys:
#
#   name, group, summary  as `Mallard new --list` shows them (groups below,
#                         in the order of examples/README.md)
#   source, files         the directory and the files copied from it; the
#                         first is the input, written as input.toml
#   dim                   2 or 3: the build it needs
#   threads, cost         run.sh's default thread count, and the size and
#                         run time for the README and the summary
#   mesh, init            commands of mesh.sh and init.sh, which run.sh calls
#   mesh_creates,         when the file they create is missing; tools/X.py
#   init_creates          names a script of tools/, copied into the case
#                         with the tools it imports
#   post, results         commands of post.sh, and what they produce;
#                         $(last PREFIX) is the newest snapshot PREFIX_N
#                         (.vtu, or .pvtu of an MPI run)
#   quick, quick_mesh,    the --quick version: "table.key = value" edits of
#   quick_init,           the input, and commands replacing the full ones.
#   quick_post            CI (templates/ci.sh) creates and runs every
#                         template with --quick.

[docs]
input = "https://matthewbonanni.github.io/mallard/docs/input/"
source = "https://github.com/MatthewBonanni/mallard/tree/main/"

# The comment written above the first header of each table in input.toml
[[tables]]
table = "run"
about = "when to stop, and the time step (cfl or dt)"
[[tables]]
table = "mesh"
about = "the mesh, generated or read from a file; its boundary zones are named here"
[[tables]]
table = "periodic"
about = "pairs of boundary zones joined periodically"
[[tables]]
table = "initialize"
about = "the state at t = 0: constant, expressions of x, y (z), or a restart file"
[[tables]]
table = "boundaries"
about = "one entry per boundary zone of the mesh"
[[tables]]
table = "numerics"
about = "Riemann solver (flux), time integrator"
[[tables]]
table = "numerics.face_reconstruction"
about = "reconstruction to the faces, which sets the order of accuracy"
[[tables]]
table = "physics"
about = "the equations (Euler, Navier-Stokes), the gas and its reference state"
[[tables]]
table = "chemistry"
about = "reactions of a gas mixture"
[[tables]]
table = "radiation"
about = "radiative heat loss"
[[tables]]
table = "les"
about = "large-eddy simulation: the subgrid model"
[[tables]]
table = "source"
about = "body forces and volume sources"
[[tables]]
table = "sponges"
about = "sponge layers that absorb outgoing waves"
[[tables]]
table = "output"
about = "how often the log prints a progress line"
[[tables]]
table = "write_data"
about = "snapshots (VTU for ParaView and tools/, HDF5, restart files)"
[[tables]]
table = "forces"
about = "forces on a boundary zone, as CSV"
[[tables]]
table = "integrals"
about = "volume integrals (kinetic energy, enstrophy, ...), as CSV"
[[tables]]
table = "statistics"
about = "running means and covariances"
[[tables]]
table = "probes"
about = "point and line probes"
[[tables]]
table = "parallel"
about = "MPI partitioning and halo exchange"

[[groups]]
name = "shocks"
title = "Shocks and compressible flow"
[[groups]]
name = "axisymmetric"
title = "Axisymmetric flows"
[[groups]]
name = "viscous"
title = "Viscous flows"
[[groups]]
name = "turbulence"
title = "Turbulence"
[[groups]]
name = "reacting"
title = "Reacting flows and mixtures"

# ---------------------------------------------------------------- shocks

[[templates]]
name = "sod"
group = "shocks"
summary = "Sod shock tube: shock, contact and rarefaction against the exact solution"
source = "examples/sod"
dim = 2
cost = "800 cells, about a second on 4 threads"
post = ["tools/plot_sod.py sod.png $(last solut/sod)"]
results = "sod.png, the density against the exact solution"
quick = ["mesh.Nx = 100"]

[[templates]]
name = "shu_osher"
group = "shocks"
summary = "Mach 3 shock running into an entropy wave, the test for high-order schemes"
source = "examples/shu_osher"
dim = 2
cost = "800 cells, seconds on 4 threads"
post = ["tools/plot_vtu.py $(last solut/shu_osher) shu_osher.png --line"]
results = "shu_osher.png, the density along the tube"
quick = ["mesh.Nx = 100"]

[[templates]]
name = "riemann_2d"
group = "shocks"
summary = "2D Riemann problem (Lax-Liu configuration 3) on triangles"
source = "examples/riemann_2d"
dim = 2
threads = 8
cost = "320,000 triangles, about 20 minutes on 8 threads"
post = ["tools/plot_vtu.py $(last solut/riemann) riemann.png",
        "tools/animate.py solut riemann"]
results = "riemann.png, the final density, and the animation riemann.mp4"
quick = ["mesh.Nx = 50", "mesh.Ny = 50", "run.t_stop = 0.1", "write_data.time_interval = 0.05"]

[[templates]]
name = "riemann_2d_quads"
group = "shocks"
summary = "The same 2D Riemann problem on quadrilaterals"
source = "examples/riemann_2d_quads"
dim = 2
threads = 8
cost = "160,000 quadrilaterals, about 9 minutes on 6 threads"
post = ["tools/plot_vtu.py $(last solut/riemann) riemann.png",
        "tools/animate.py solut riemann"]
results = "riemann.png, the final density, and the animation riemann.mp4"
quick = ["mesh.Nx = 50", "mesh.Ny = 50", "run.t_stop = 0.1", "write_data.time_interval = 0.05"]

[[templates]]
name = "double_mach"
group = "shocks"
summary = "Double Mach reflection of a Mach 10 shock"
source = "examples/double_mach"
dim = 2
threads = 8
cost = "460,000 triangles, about an hour on 12 threads"
post = ["tools/plot_vtu.py $(last solut/dmr) dmr.png",
        "tools/animate.py solut dmr --title \"Double Mach reflection\" --xlim 0 3"]
results = "dmr.png, the final density, and the animation dmr.mp4"
