# --------------------------------------------------------------- viscous

[[templates]]
name = "viscous_shock_tube"
group = "viscous"
summary = "Daru-Tenaud viscous shock tube: shock / boundary-layer interaction"
source = "examples/viscous_shock_tube"
dim = 2
cost = "500,000 quadrilaterals; use a GPU, or Nx = 500, Ny = 250 for 20 minutes on 6 threads"
post = ["tools/plot_viscous_shock_tube.py $(last solut/vst) vst.png"]
quick_post = ["tools/plot_vtu.py $(last solut/vst) vst.png"]
results = "vst.png, the density and wall density against the reference"
quick = ["mesh.Nx = 100", "mesh.Ny = 50", "run.t_stop = 0.05"]

[[templates]]
name = "cylinder"
group = "viscous"
summary = "Flow past a cylinder at Re = 100: vortex shedding"
source = "examples/cylinder"
dim = 2
cost = "49,152 quadrilaterals, about 50 minutes on a laptop CPU"
mesh = ["tools/make_cylinder_mesh.py cylinder.msh --n-theta 384 --n-r 128 --r-far 25 --dr0 0.01"]
mesh_creates = "cylinder.msh"
quick_mesh = ["tools/make_cylinder_mesh.py cylinder.msh --n-theta 64 --n-r 24 --r-far 10 --dr0 0.05"]
post = ["tools/plot_vtu.py $(last solut/cylinder) cylinder.png --var U_Y",
        "tools/animate.py solut cylinder --glob \"cylinder_*\" --var VORTICITY --cmap RdBu_r --xlim -2 12 --ylim -4 4 --title \"Cylinder, Re = 100\""]
results = "cylinder.png, the transverse velocity, and the animation cylinder.mp4 (forces in solut/forces_cylinder.csv)"
quick = ["run.t_stop = 2.0", "write_data.time_interval = 1.0"]

[[templates]]
name = "sphere_re300"
group = "viscous"
summary = "Flow past a sphere at Re = 300: hairpin vortex shedding, prisms and tetrahedra"
source = "examples/sphere_re300"
dim = 3
cost = "850,000 cells, about 4.7 hours on four A100s"
mesh = ["tools/make_sphere_re300_mesh.py sphere.msh"]
mesh_creates = "sphere.msh"
quick_mesh = ["tools/make_sphere_re300_mesh.py sphere.msh --h-wall 0.3 --dn0 0.05 --n-layers 2 --h-near 0.4 --h-wake 0.6 --h-far 6 --x-min -6 --x-max 10 --half-width 6"]
post = ["tools/plot_sphere_re300.py solut/forces_sphere.csv --t-start 450"]
quick_post = ["tools/plot_vtu.py $(last solut/sphere) sphere.png --var U_X"]
results = "sphere_re300.png, drag and lift with the Strouhal number against the literature"
quick = ["run.t_stop = 0.5", "write_data.time_interval = 0.5"]

