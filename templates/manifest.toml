dim = 2
cost = "19,200 quadrilaterals, minutes on 4 threads"
post = ["tools/plot_vtu.py $(last solut/wedge) wedge.png --var P"]
results = "wedge.png, the pressure of the last snapshot"
quick = ["mesh.Nx = 40", "mesh.Ny = 30", "run.t_stop = 0.002"]

[[templates]]
name = "explosion_3d"
group = "shocks"
summary = "Spherical explosion: one octant with symmetry planes, on hexahedra"
source = "examples/explosion_3d"
dim = 3
threads = 8
cost = "262,144 cells, about 5 minutes on 8 threads"
post = ["tools/plot_vtu.py $(last solut/explosion) explosion.png --slice z --at 0"]
results = "explosion.png, the density on the symmetry plane z = 0"
quick = ["mesh.Nx = 16", "mesh.Ny = 16", "mesh.Nz = 16", "run.t_stop = 0.05"]

[[templates]]
name = "sedov_3d"
group = "shocks"
summary = "Sedov-Taylor point blast against the exact similarity solution"
source = "examples/sedov_3d"
dim = 3
cost = "2.1M cells, about 1.5 hours on four A100s"
post = ["tools/sedov.py solut --energy 1"]
results = "sedov.png, the shock radius and density profile against the exact solution"
quick = ["mesh.Nx = 24", "mesh.Ny = 24", "mesh.Nz = 24", "run.t_stop = 0.2"]

[[templates]]
name = "sphere_mach3"
group = "shocks"
summary = "Mach 3 flow over a sphere on tetrahedra: bow-shock standoff"
source = "examples/sphere_mach3"
dim = 3
cost = "800,000 tetrahedra, about 1.5 hours on four A100s"
mesh = ["tools/make_sphere_mesh.py sphere.msh"]
mesh_creates = "sphere.msh"
quick_mesh = ["tools/make_sphere_mesh.py sphere.msh --h-wall 0.08 --h-shock 0.08 --h-far 0.4"]
post = ["tools/plot_vtu.py $(last slices/z0) sphere.png --var P"]
results = "sphere.png, the pressure on the symmetry plane z = 0"
quick = ["run.t_stop = 0.04"]

[[templates]]
name = "mallard"
group = "shocks"
summary = "Mach 8 flow over a flying mallard"
source = "examples/mallard"
dim = 2
threads = 8
cost = "1.07M triangles, about 1.5 hours on a GPU"
mesh = ["tools/make_mallard_mesh.py mallard.msh"]
mesh_creates = "mallard.msh"
quick_mesh = ["tools/make_mallard_mesh.py mallard.msh --h-wall 0.02 --h-far 0.1 --growth 0.5"]
post = ["tools/plot_vtu.py $(last solut/mallard) mallard.png",
        "tools/animate.py solut mallard --var MACH --cmap inferno_r --title \"Mach 8 mallard\""]
results = "mallard.png, the final density, and the animation mallard.mp4"
quick = ["run.t_stop = 0.01", "write_data.time_interval = 0.005"]

