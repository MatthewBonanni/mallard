# Performance set: the 2D Riemann problem, configuration 3
# (examples/riemann_2d_quads), on 1024 x 1024 quadrilaterals (1,048,576 cells)
# with MUSCL, HLLC and SSPRK3 for a fixed 300 steps without output. The run's
# summary gives the throughput (cells/s over the time stepping). See
# benchmarks/README.md.

[run]
n_steps = 300
cfl = 0.25

[mesh]
type = "cartesian"
Nx = 1024
Ny = 1024
Lx = 1.0
Ly = 1.0

[initialize]
type = "analytical"
rho = """\
    x >= 0.8 ? (y >= 0.8 ? 1.5 : 0.532258064516129) \
             : (y >= 0.8 ? 0.532258064516129 : 0.137992831541219)"""
u = [
    "x >= 0.8 ? 0.0 : 1.206045378311055",
    "y >= 0.8 ? 0.0 : 1.206045378311055",
]
p = """\
    x >= 0.8 ? (y >= 0.8 ? 1.5 : 0.3) \
             : (y >= 0.8 ? 0.3 : 0.029032258064516)"""

[[boundaries]]
name = "left"
type = "extrapolation"

[[boundaries]]
name = "right"
type = "extrapolation"

[[boundaries]]
name = "top"
type = "extrapolation"

[[boundaries]]
name = "bottom"
type = "extrapolation"

[numerics]
riemann_solver = "HLLC"
time_integrator = "SSPRK3"

[numerics.face_reconstruction]
type = "MUSCL"

[physics]
type = "euler"
gamma = 1.4
p_ref = 1.0
T_ref = 1.0
rho_ref = 1.0

[output]
check_interval = 100
