# Mallard on several GPU nodes with the Kubeflow MPI Operator (v2beta1): a launcher runs
# mpirun, which starts the ranks in the workers over SSH; halos go between GPUs with NCCL.
# The volume of pvc.yaml must be ReadWriteMany. The workers run sshd as root.
#
#   kubectl apply -f pvc.yaml -f mpijob.yaml
#   kubectl logs -f job/mallard-mpi-launcher
apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: mallard-mpi
spec:
  slotsPerWorker: 4                 # ranks per worker: one per GPU
  launcherCreationPolicy: WaitForWorkersReady
  runPolicy:
    cleanPodPolicy: Running
    backoffLimit: 2
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          terminationGracePeriodSeconds: 600
          # imagePullSecrets: [{name: ghcr}]   # while the images are private
          containers:
            - name: launcher
              image: ghcr.io/matthewbonanni/mallard:cuda
              env:
                - {name: CASE, value: /data/examples/riemann_2d}
                - {name: RANKS, value: "8"}             # workers x slotsPerWorker
                - {name: OMP_NUM_THREADS, value: "8"}
              command: [bash, -c]
              args:
                - |
                  set -eu
                  [ -d /data/examples ] || cp -r "$MALLARD_SHARE/examples" "$MALLARD_SHARE/mechanisms" /data
                  cd "$CASE"
                  [ -e .started ] || touch .started
                  input=input.toml
                  restart=$(find . -name '*.restart' -newer .started -printf '%T@ %p\n' | sort -n | tail -n 1 | cut -d ' ' -f 2-)
                  if [ -n "$restart" ]; then
                      echo "Resuming from $restart"
                      awk '/^\[+initialize[].]/ {skip = 1; next} /^\[/ {skip = 0} !skip' input.toml > resume.toml
                      printf '\n[initialize]\ntype = "restart"\nfile = "%s"\n' "$restart" >> resume.toml
                      input=resume.toml
                  fi
                  exec mpirun -n "$RANKS" --bind-to none -x OMP_NUM_THREADS mallard -i "$input"
              lifecycle:
                # mpirun passes SIGUSR2 on to the ranks, which write a restart file and stop
                preStop:
                  exec:
                    command: [bash, -c, 'kill -USR2 1; while kill -0 1 2> /dev/null; do sleep 1; done']
              resources:
                requests: {cpu: "1", memory: 2Gi}
              volumeMounts:
                - {name: data, mountPath: /data}
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: mallard-data}
    Worker:
      replicas: 2
      template:
        spec:
          # imagePullSecrets: [{name: ghcr}]
          containers:
            - name: worker
              image: ghcr.io/matthewbonanni/mallard:cuda
              command: [bash, -c, 'ssh-keygen -A && mkdir -p /run/sshd && exec /usr/sbin/sshd -De']
              resources:
                requests: {nvidia.com/gpu: "4", cpu: "32", memory: 128Gi}
                limits: {nvidia.com/gpu: "4", memory: 128Gi}
              volumeMounts:
                - {name: data, mountPath: /data}
                - {name: dshm, mountPath: /dev/shm}
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: mallard-data}
            - name: dshm
              emptyDir: {medium: Memory, sizeLimit: 32Gi}
