name: Changelog

# Runs on every pull request (it takes seconds): a branch that changes src/ must
# add a bullet under "## [Unreleased]" in CHANGELOG.md, or carry the
# "no-changelog" label. See docs/design/documentation.md#changelog.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  changelog:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/changelog.py check origin/${{ github.base_ref }}
