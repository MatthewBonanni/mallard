name: Train

# Lands several pull requests on one CI run (tools in the maintainers' own scripts): their
# heads are merged onto main in a train/* branch, ci.yml runs there once, and this workflow
# then sets the commit status `CI` that main requires on each head the train contains, so
# the pull requests can merge without a run each. Run from main:
#   gh workflow run train.yml --ref main -f run=<ci.yml run on the train> -f shas="<sha> ..."
on:
  workflow_dispatch:
    inputs:
      run:
        description: The passed ci.yml run on the train/* branch
        type: string
        required: true
      shas:
        description: Space-separated head commits of the pull requests (and stack layers) in the train
        type: string
        required: true

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  stamp:
    runs-on: ubuntu-26.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run }}
          SHAS: ${{ inputs.shas }}
        run: |
          read -r path event branch conclusion train < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" \
            --jq '"\(.path) \(.event) \(.head_branch) \(.conclusion) \(.head_sha)"')
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN"
          echo "run $RUN: $path $event $branch $conclusion $train"
          [ "$path" = .github/workflows/ci.yml ] && [ "$event" = workflow_dispatch ] \
            && [ "${branch#train/}" != "$branch" ] && [ "$conclusion" = success ] \
            || { echo "::error::$url is not a passed ci.yml run on a train/* branch"; exit 1; }
          ci=$(gh api "repos/$GITHUB_REPOSITORY/commits/$train/status" \
            --jq '.statuses[] | select(.context == "CI") | "\(.state)\t\(.description)"')
          [ "${ci%%$'\t'*}" = success ] || { echo "::error::CI on the train $train is not success"; exit 1; }
          for sha in $SHAS; do
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$train" --jq .status)
            case "$status" in ahead|identical) ;;
              *) echo "::error::$sha is not in the train $train ($status)"; exit 1 ;;
            esac
          done
          for sha in $SHAS; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state=success -f context=CI \
              -f description="Passed in train ${train:0:8} (run $RUN)" -f target_url="$url" > /dev/null
            echo "CI success on $sha"
          done
