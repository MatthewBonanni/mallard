# Distribution of a release: the container images (CPU for amd64 and arm64, CUDA) and
# the Spack package, each smoke-tested by running examples and comparing them with
# reference solutions (docker/smoke/run.sh). A release is dispatched on main once the
# release PR has landed, and creates the tag v<version> only after every image and the
# Spack package pass, so a broken build leaves no tag behind:
#   gh workflow run release.yml --ref main -f version=X.Y.Z
# It pushes the images to ghcr.io/matthewbonanni/mallard:
#   <version>, latest            CPU (OpenMP + MPI), amd64 and arm64
#   <version>-cuda, cuda         NVIDIA GPUs (CUDA + OpenMP + MPI), sm_80, 86, 89 and 90
# To test a branch, run it without a version; it pushes nothing unless asked:
#   gh workflow run release.yml --ref <branch>
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release this version (X.Y.Z, on main) and tag it v<version> once everything passes
        type: string
        default: ''
      push:
        description: Without a version, push the images, tagged with the branch name
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/matthewbonanni/mallard
  RELEASE: ${{ inputs.version != '' }}
  PUSH: ${{ inputs.version != '' || inputs.push }}

jobs:
  meta:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        if: env.RELEASE == 'true'
      - id: v
        env:
          REF: ${{ github.ref_name }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RELEASE" = true ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Release from main, not $REF"; exit 1; }
            grep -q "^project(Mallard VERSION $VERSION " CMakeLists.txt || { echo "::error::CMakeLists.txt is not at version $VERSION"; exit 1; }
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" > /dev/null 2>&1; then echo "::error::Tag v$VERSION exists"; exit 1; fi
            version="$VERSION"
          else
            version="$(tr -c 'a-zA-Z0-9.\n-' - <<< "$REF")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  cpu:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    name: cpu (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 src/external/kokkos src/external/toml11
      # The images report git describe, which the tag created at the end gives
      - name: Tag the checkout
        if: env.RELEASE == 'true'
        run: git tag "v${{ needs.meta.outputs.version }}"
      - name: Build
        run: docker build -f docker/Dockerfile -t mallard:test .
      - name: Smoke test
        run: docker run --rm -v "$PWD/docker/smoke:/smoke:ro" mallard:test /smoke/run.sh
      - name: Smoke test (Apptainer)
        if: matrix.arch == 'amd64'
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update -qq && sudo apt-get install -y -qq apptainer
          # Ubuntu 26.04 confines unprivileged user namespaces, which apptainer exec needs
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          apptainer build mallard.sif docker-daemon://mallard:test
          apptainer exec --bind "$PWD/docker/smoke:/smoke" mallard.sif /smoke/run.sh
      - name: Push
        if: env.PUSH == 'true'
        env:
          TAG: ${{ needs.meta.outputs.version }}-cpu-${{ matrix.arch }}
        run: |
          docker login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
          docker tag mallard:test "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"

  cuda:
    needs: meta
    runs-on: ubuntu-26.04
    timeout-minutes: 340
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 src/external/kokkos src/external/toml11
      - name: Tag the checkout
        if: env.RELEASE == 'true'
        run: git tag "v${{ needs.meta.outputs.version }}"
      - name: Build
        run: docker build -f docker/Dockerfile.cuda --build-arg JOBS=3 -t mallard:cuda .
      # No GPU here: the build checks the machine code for each architecture; this
      # checks that the executables load and run up to Kokkos' initialization
      - name: Smoke test
        run: |
          docker run --rm mallard:cuda bash -c '
            set -e
            ldd /opt/mallard/bin/* /opt/mallard/lib/libmallard* | grep "not found" | grep -v libcuda.so && exit 1
            export LD_LIBRARY_PATH=/usr/local/cuda/compat:$LD_LIBRARY_PATH
            mallard --version && mallard2d --version && mallard3d --version
            cd /tmp && python3 -c "import mallard; t = mallard.open(\"$MALLARD_SHARE/examples/autoignition_2d/deflagration.csv\"); print(t.read_all(\"S_L\").size)"
            mallard reactor --help 2>&1 | grep -q Usage
            mallard mesh convert --help 2>&1 | grep -q Usage
            ls $MALLARD_SHARE/examples/sod/input.toml'
      - name: Push
        if: env.PUSH == 'true'
        env:
          TAG: ${{ needs.meta.outputs.version }}-cuda
        run: |
          docker login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
          docker tag mallard:cuda "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"

  # spack install of this checkout (CPU: OpenMP, MPI, HDF5, CGNS, zlib, 2D and 3D) with
  # the package in spack/, then its standalone test and the smoke test
  spack:
    needs: meta
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 src/external/toml11
      - name: Tag the checkout
        if: env.RELEASE == 'true'
        run: git tag "v${{ needs.meta.outputs.version }}"
      - name: Install MPI and Python packages
        run: >
          sudo apt-get update -qq && sudo apt-get install -y -qq
          libopenmpi-dev openmpi-bin python3-numpy python3-scipy python3-matplotlib python3-h5py
      - uses: spack/setup-spack@v3
        with:
          spack_ref: releases/v1.2
          packages_ref: develop
          spack_path: .spack-tool
          packages_path: .spack-packages
          buildcache: false
      # The system's GCC, CMake and Open MPI; Spack builds the rest
      - name: Install
        run: |
          # As documented: the package from this repository on GitHub, at this commit
          spack repo add --path spack/spack_repo/mallard "https://github.com/$GITHUB_REPOSITORY.git"
          spack repo update mallard --commit "$GITHUB_SHA"
          spack info mallard | head -n 3
          spack compiler find
          mkdir -p "$RUNNER_TEMP/env"
          # Spack runs Python extensions with python-venv's python3, which sees only the venv:
          # this one also sees the runner's numpy, SciPy and h5py
          /usr/bin/python3 -m venv --without-pip --system-site-packages "$RUNNER_TEMP/venv"
          cat > "$RUNNER_TEMP/env/spack.yaml" << EOF
          spack:
            specs: [mallard@main]
            view: false
            concretizer: {reuse: false}
            # Outside the source tree, which CMake leaves out of installed RPATHs
            config: {install_tree: {root: $RUNNER_TEMP/spack-opt}}
            develop:
              mallard: {spec: mallard@=main, path: $GITHUB_WORKSPACE}
            packages:
              c: {require: [gcc]}
              cxx: {require: [gcc]}
              fortran: {require: [gcc]}
              mpi: {require: [openmpi]}
              openmpi:
                buildable: false
                externals: [{spec: openmpi@$(dpkg-query -W -f '${Version}' openmpi-bin | cut -d- -f1), prefix: /usr}]
              python:
                buildable: false
                externals: [{spec: python@$(/usr/bin/python3 -c 'import platform; print(platform.python_version())'), prefix: /usr}]
              py-numpy:
                buildable: false
                externals: [{spec: py-numpy@$(/usr/bin/python3 -c 'import numpy; print(numpy.__version__)'), prefix: /usr}]
              python-venv:
                buildable: false
                externals: [{spec: python-venv@1.0, prefix: $RUNNER_TEMP/venv}]
              cmake:
                buildable: false
                externals: [{spec: cmake@$(cmake --version | head -1 | cut -d' ' -f3), prefix: $(dirname "$(dirname "$(command -v cmake)")")}]
          EOF
          cat "$RUNNER_TEMP/env/spack.yaml"
          spack -e "$RUNNER_TEMP/env" concretize
          spack -e "$RUNNER_TEMP/env" install --fail-fast
      - name: Concretize the other variants in docs/installation.md
        run: |
          spack -e "$RUNNER_TEMP/env" spec mallard +cuda cuda_arch=80
          spack -e "$RUNNER_TEMP/env" spec mallard +rocm amdgpu_target=gfx90a
          spack -e "$RUNNER_TEMP/env" spec mallard +cuda cuda_arch=90 +nccl
          spack -e "$RUNNER_TEMP/env" spec mallard ~mpi dims=3 precision=single
      - name: Test
        run: |
          spack -e "$RUNNER_TEMP/env" test run mallard
          eval "$(spack -e "$RUNNER_TEMP/env" load --sh mallard)"
          docker/smoke/run.sh "$(spack -e "$RUNNER_TEMP/env" location -i mallard)"

  # The version's image tags, once every image and the Spack package pass, then the git tag
  publish:
    needs: [meta, cpu, cuda, spack]
    if: inputs.version != '' || inputs.push
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Tag the images
        env:
          V: ${{ needs.meta.outputs.version }}
        run: |
          docker login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
          tags=(-t "$IMAGE:$V")
          [ "$RELEASE" = true ] && tags+=(-t "$IMAGE:latest")
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$V-cpu-amd64" "$IMAGE:$V-cpu-arm64"
          [ "$RELEASE" = true ] && docker buildx imagetools create -t "$IMAGE:cuda" "$IMAGE:$V-cuda"
          true
      - name: Tag the release
        if: env.RELEASE == 'true'
        env:
          V: ${{ needs.meta.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$V" -f sha="$GITHUB_SHA"
