# Distribution of a release: the container images (CPU for amd64 and arm64, CUDA) and
# the Spack package, each smoke-tested by running examples and comparing them with
# reference solutions (docker/smoke/run.sh). A version tag (v*) pushes the images to
# ghcr.io/matthewbonanni/mallard:
#   <version>, latest            CPU (OpenMP + MPI), amd64 and arm64
#   <version>-cuda, cuda         NVIDIA GPUs (CUDA + OpenMP + MPI), sm_80, 86, 89 and 90
# To test a branch, run it by hand; it pushes nothing unless asked:
#   gh workflow run release.yml --ref <branch>
name: Release

on:
  push:
    tags: ['v*']
    branches: [distribution-spack-containers]  # TEMPORARY: test on the PR branch (images are not pushed)
  workflow_dispatch:
    inputs:
      push:
        description: Push the images, tagged with the branch name
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/matthewbonanni/mallard
  PUSH: ${{ github.ref_type == 'tag' || inputs.push }}

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          REF: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${REF#v}"; else version="$(tr -c 'a-zA-Z0-9.\n-' - <<< "$REF")"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  cpu:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    name: cpu (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 src/external/kokkos src/external/toml11
      - name: Build
        run: docker build -f docker/Dockerfile -t mallard:test .
      - name: Smoke test
        run: docker run --rm -v "$PWD/docker/smoke:/smoke:ro" mallard:test /smoke/run.sh
      - name: Smoke test (Apptainer)
        if: matrix.arch == 'amd64'
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update -qq && sudo apt-get install -y -qq apptainer
          apptainer build mallard.sif docker-daemon://mallard:test
          apptainer exec --bind "$PWD/docker/smoke:/smoke" mallard.sif /smoke/run.sh
      - name: Push
        if: env.PUSH == 'true'
        env:
          TAG: ${{ needs.meta.outputs.version }}-cpu-${{ matrix.arch }}
        run: |
          docker login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
          docker tag mallard:test "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"

  cuda:
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 src/external/kokkos src/external/toml11
      - name: Build
        run: docker build -f docker/Dockerfile.cuda --build-arg JOBS=3 -t mallard:cuda .
      # No GPU here: the build checks the machine code for each architecture; this
      # checks that the executables load and run up to Kokkos' initialization
      - name: Smoke test
        run: |
          docker run --rm mallard:cuda bash -c '
            set -e
            ldd /opt/mallard/bin/* | grep "not found" | grep -v libcuda.so && exit 1
            export LD_LIBRARY_PATH=/usr/local/cuda/compat:$LD_LIBRARY_PATH
            Mallard --version && Mallard3D --version
            MallardReactor 2>&1 | grep -q Usage
            mallard-mesh-convert 2>&1 | grep -q Usage
            ls $MALLARD_SHARE/examples/sod/input.toml'
      - name: Push
        if: env.PUSH == 'true'
        env:
          TAG: ${{ needs.meta.outputs.version }}-cuda
        run: |
          docker login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
          docker tag mallard:cuda "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"

  # spack install of this checkout (CPU: OpenMP, MPI, HDF5, CGNS, 2D and 3D) with the
  # package in spack/, then its standalone test and the smoke test
  spack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 src/external/toml11
      - name: Install MPI and Python packages
        run: >
          sudo apt-get update -qq && sudo apt-get install -y -qq
          libopenmpi-dev openmpi-bin python3-numpy python3-scipy python3-matplotlib
      - uses: spack/setup-spack@v3
        with:
          spack_ref: releases/v1.2
          packages_ref: develop
          spack_path: ${{ runner.temp }}/spack
          packages_path: ${{ runner.temp }}/spack-packages
      - name: Install
        run: |
          spack external find --not-buildable openmpi cmake
          spack repo add spack/spack_repo/mallard
          spack env create -d "$RUNNER_TEMP/env"
          spack -e "$RUNNER_TEMP/env" add mallard@main
          spack -e "$RUNNER_TEMP/env" develop --no-clone --path "$GITHUB_WORKSPACE" mallard@main
          spack -e "$RUNNER_TEMP/env" concretize
          spack -e "$RUNNER_TEMP/env" install --fail-fast
      - name: Test
        run: |
          spack -e "$RUNNER_TEMP/env" test run mallard
          docker/smoke/run.sh "$(spack -e "$RUNNER_TEMP/env" location -i mallard)"

  # The version's tags, once every image and the Spack package pass
  publish:
    needs: [meta, cpu, cuda, spack]
    if: github.ref_type == 'tag' || inputs.push
    runs-on: ubuntu-latest
    steps:
      - name: Tag
        env:
          V: ${{ needs.meta.outputs.version }}
          RELEASE: ${{ github.ref_type == 'tag' }}
        run: |
          docker login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
          tags=(-t "$IMAGE:$V")
          [ "$RELEASE" = true ] && tags+=(-t "$IMAGE:latest")
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$V-cpu-amd64" "$IMAGE:$V-cpu-arm64"
          [ "$RELEASE" = true ] && docker buildx imagetools create -t "$IMAGE:cuda" "$IMAGE:$V-cuda"
          true
