# Publish the website (matthewbonanni.github.io/mallard) for each release.
# The site's source lives in MatthewBonanni/mallard-website; this workflow builds it
# against the release and deploys it to this repository's GitHub Pages.
name: Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Mallard ref to document (default: latest release tag)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mallard
        uses: actions/checkout@v4
        with:
          path: mallard
          fetch-depth: 0
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          repository: MatthewBonanni/mallard-website
          path: website
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq doxygen
          pip install -r website/requirements.txt
      - name: Build
        run: website/build.sh mallard ${{ github.event.release.tag_name || inputs.ref }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
