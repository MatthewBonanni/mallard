name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend:
          - name: serial
            flags: -DKokkos_ENABLE_SERIAL=ON
          - name: openmp
            flags: -DKokkos_ENABLE_OPENMP=ON
          - name: mpi
            flags: -DKokkos_ENABLE_SERIAL=ON -DMallard_ENABLE_MPI=ON -DMallard_ENABLE_KAMINPAR=ON -DMallard_ENABLE_HDF5=ON
            mpi: true
          - name: serial-3d
            flags: -DKokkos_ENABLE_SERIAL=ON -DMallard_DIM=3 -DMallard_ENABLE_HDF5=ON
            hdf5: true
          - name: mpi-3d
            flags: -DKokkos_ENABLE_SERIAL=ON -DMallard_ENABLE_MPI=ON -DMallard_DIM=3 -DMallard_ENABLE_HDF5=ON
            mpi: true
    name: ${{ matrix.backend.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install MPI
        if: matrix.backend.mpi
        run: >
          sudo apt-get update -qq && sudo apt-get install -y -qq
          libopenmpi-dev openmpi-bin libtbb-dev libhdf5-openmpi-dev
      - name: Install HDF5
        if: matrix.backend.hdf5
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libhdf5-dev
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DUSE_SYSTEM_KOKKOS=OFF ${{ matrix.backend.flags }}
      - name: Build
        run: cmake --build build -j $(nproc)
      - name: Test
        if: ${{ !matrix.backend.mpi }}
        env:
          OMP_NUM_THREADS: 2
        run: ./build/test/MallardTest
      - name: Test (MPI)
        if: matrix.backend.mpi
        run: |
          mpirun -n 1 ./build/test/MallardTest
          for n in 2 3 4; do
            mpirun -n $n --oversubscribe ./build/test/MallardTest --gtest_filter='CommTest.*:MeshBlockTest.*:DistributedMeshTest.*:MPITest.*:MPI3DTest.*'
          done

