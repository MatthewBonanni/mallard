name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend:
          - name: serial
            flags: -DKokkos_ENABLE_SERIAL=ON
          - name: openmp
            flags: -DKokkos_ENABLE_OPENMP=ON
    name: ${{ matrix.backend.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DUSE_SYSTEM_KOKKOS=OFF ${{ matrix.backend.flags }}
      - name: Build
        run: cmake --build build -j $(nproc)
      - name: Test
        env:
          OMP_NUM_THREADS: 2
        run: ./build/test/MallardTest
