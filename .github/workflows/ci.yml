name: CI

# Pull requests don't run CI on every push: when a PR is ready to land, run
#   gh workflow run ci.yml --ref <branch>
# The run sets the commit status `CI` on the branch's head commit (pending, then success
# or failure, linking to the run) and a status per job, `CI / <job>`, as it is queued,
# runs and ends (tools/dev/ci_status.sh), linking to its log. main requires `CI` to merge,
# so a new push needs a new run.
#
# Two tiers. A branch runs the gate: the x86-64 suites of each backend, precision and
# dimension, GCC 16 and Clang 23, and the CUDA, HIP and SYCL builds when it changes device
# code. Each merge into main runs the gate again on main; every 3 hours, if main has
# changed, main runs everything: arm64, macOS, every compiler and CUDA version, Spack, the
# tutorials and the fuzzers. A failure on main opens an issue. -f full=true runs everything
# on a branch.
on:
  # The full tier every 3 hours on main, if main has changed since its last full run
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'CITATION.cff'
      - 'LICENSE'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      full:
        description: Run everything main runs, not only the gate
        type: boolean
        default: false
      device:
        description: Run the device builds (CUDA, HIP, SYCL) even without device-code changes
        type: boolean
        default: false
      only:
        description: >-
          Run only these jobs, comma-separated (backend names, tutorials, device, spack, fuzz;
          any other name fails the run), e.g. after resolving a conflict that can affect
          only them; empty runs all
        type: string
        default: ''
      gtest_filter:
        description: >-
          Run only these tests (googletest --gtest_filter, -* for none) in the backend jobs, which
          still build and run their other checks in full; empty runs every test
        type: string
        default: ''

permissions:
  actions: read
  contents: read
  issues: write
  statuses: write
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' && 'full' || 'gate' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # First and fast: a branch that changes src/ adds a changelog fragment
  # (changelog/, see docs/design/documentation.md#changelog) unless its pull
  # request is labeled no-changelog. The other jobs wait for it.
  changelog:
    runs-on: ubuntu-26.04
    steps:
      - name: Report the run on the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=CI
          -f description="Running" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report the job as running
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ job.check_run_id }}
          STATUS_NAME: changelog
        run: sh tools/dev/ci_status.sh running
      - name: Check the job names of the only input
        if: inputs.only
        env:
          ONLY: ${{ inputs.only }}
        run: python3 tools/dev/check_ci_only.py "$ONLY"
      # The checks that need no build (also before asking for a run: tools/dev/precheck.sh)
      - name: Check the sources without a build
        env:
          PRECHECK_SKIP_CHANGELOG: 1
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install -q --break-system-packages pyyaml
          sh tools/dev/precheck.sh
      - name: Check for a changelog fragment
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" != main ] && gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
              --json labels -q '.[].labels[].name' | grep -qx no-changelog; then
            echo "Labeled no-changelog: skipped."
          else
            python3 tools/dev/changelog.py check origin/main
          fi
      - name: Report the job's result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ job.check_run_id }}
          STATUS_NAME: changelog
        run: sh tools/dev/ci_status.sh ${{ job.status }}

  # Whether the changes touch device code (tools/dev/device_changes.sh); the CUDA, HIP and SYCL
  # builds run only then (CUDA also on main). Also the tier: full on main and with -f full=true.
  device:
    runs-on: ubuntu-26.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      code: ${{ steps.check.outputs.code }}
      full: ${{ steps.check.outputs.full }}
      cuda: ${{ steps.check.outputs.cuda }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report the job as running
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ job.check_run_id }}
          STATUS_NAME: device
        run: sh tools/dev/ci_status.sh running
      - id: check
        env:
          BEFORE: ${{ github.event.before }}
          FULL: ${{ github.event_name == 'schedule' || inputs.full }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          cuda='[
            {"name": "cuda-13.5", "cuda": "13.5.0", "os": "ubuntu-26.04", "arch": "-DKokkos_ARCH_AMPERE80=ON", "gate": true},
            {"name": "cuda-13.4", "cuda": "13.4.3", "os": "ubuntu-26.04", "arch": "-DKokkos_ARCH_AMPERE80=ON"},
            {"name": "cuda-13.5-arm64", "cuda": "13.5.0", "os": "ubuntu-26.04-arm", "arch": "-DKokkos_ARCH_HOPPER90=ON"}
          ]'
          if [ "$FULL" != true ]; then cuda=$(jq 'map(select(.gate))' <<< "$cuda"); fi
          echo "cuda=$(jq -c . <<< "$cuda")" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ]; then base=$BEFORE
          elif [ "$GITHUB_EVENT_NAME" = schedule ]; then
            base=$(gh run list -R "$GITHUB_REPOSITORY" -w ci.yml -e schedule -s success -L 1 \
              --json headSha -q '.[0].headSha // ""')
            [ -n "$base" ] && git cat-file -e "$base^{commit}" 2> /dev/null || base=HEAD~20
          elif [ "$GITHUB_REF_NAME" = main ]; then base=HEAD^
          else base=$(git merge-base origin/main HEAD); fi
          echo "changed=$(tools/dev/device_changes.sh "$base")" >> "$GITHUB_OUTPUT"
          # Documentation alone needs none of the build jobs
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$(git rev-parse "$base")" = "$(git rev-parse HEAD)" ]; then
            echo code=false >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD | grep -qvE '^docs/|\.md$|^CITATION\.cff$|^LICENSE$'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi
      - name: Report the jobs that will run as queued
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.check.outputs.code }}
          CHANGED: ${{ steps.check.outputs.changed }}
          FULL: ${{ steps.check.outputs.full }}
          CUDA: ${{ steps.check.outputs.cuda }}
          FORCE_DEVICE: ${{ inputs.device }}
          ONLY: ${{ inputs.only }}
        run: |
          # The full tier's jobs, or the ones -f only names
          named() { case ",$ONLY," in *",$1,"*) true ;; *) false ;; esac; }
          want() { [ -z "$ONLY" ] || named "$1"; }
          extra() { if [ -n "$ONLY" ]; then named "$1"; else [ "$FULL" = true ]; fi; }
          names=""
          if [ "$CODE" = true ]; then
            if extra tutorials; then names="tutorials"; fi
            if extra fuzz; then names="$names fuzz-2d"; fi
            if extra spack; then names="$names ubi8-spack ubi9-spack"; fi
          fi
          if { [ "$CHANGED" = true ] || [ "$GITHUB_REF" = refs/heads/main ] || [ "$FORCE_DEVICE" = true ]; } && want device; then
            for t in $(jq -r '.[].name' <<< "$CUDA"); do names="$names $t-2d $t-3d"; done
          fi
          if { [ "$CHANGED" = true ] || [ "$FORCE_DEVICE" = true ]; } && want device; then
            names="$names hip-2d hip-3d sycl-2d sycl-3d"
          fi
          if [ -n "$names" ]; then sh tools/dev/ci_status.sh queued $names; fi
      - name: Report the job's result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ job.check_run_id }}
          STATUS_NAME: device
        run: sh tools/dev/ci_status.sh ${{ job.status }}

  # Every supported Linux compiler (GCC 15 and 16, Clang 22 and 23) on x86-64 and arm64,
  # each running its suite: the default GCC 15 runs the OpenMP, MPI, single-precision, 3D
  # and serial builds on x86-64, and each backend variant also runs once on
  # arm64 with one of the compilers. macOS runs the 2D and 3D suites with Apple Clang and
  # the 2D suite with Homebrew's GCC. The GCC 16 jobs build with CMake 4.2.3, the oldest
  # supported; the others with the runners' CMake. Branches run the jobs marked gate.
  matrix:
    needs: [changelog, device]
    if: needs.device.outputs.code == 'true'
    runs-on: ubuntu-26.04
    outputs:
      backends: ${{ steps.pick.outputs.backends }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - id: pick
        env:
          FULL: ${{ needs.device.outputs.full }}
          ONLY: ${{ inputs.only }}
          GH_TOKEN: ${{ github.token }}
        run: |
          backends='[
            {"name": "openmp", "flags": "-DKokkos_ENABLE_OPENMP=ON -DMallard_ENABLE_HDF5=ON -DMallard_ENABLE_CGNS=ON -DMallard_ENABLE_ZLIB=ON", "cgns": true, "full": true, "gate": true},
            {"name": "mpi", "flags": "-DKokkos_ENABLE_SERIAL=ON -DMallard_ENABLE_MPI=ON -DMallard_ENABLE_KAMINPAR=ON -DMallard_ENABLE_HDF5=ON -DMallard_ENABLE_ZLIB=ON", "mpi": true, "shards": 2, "gate": true},
            {"name": "mpi-3d", "flags": "-DKokkos_ENABLE_SERIAL=ON -DMallard_ENABLE_MPI=ON -DMallard_DIM=3 -DMallard_ENABLE_HDF5=ON", "mpi": true, "full": true, "shards": 4, "gate": true},
            {"name": "serial", "flags": "-DKokkos_ENABLE_SERIAL=ON", "full": true},
            {"name": "serial-3d", "flags": "-DKokkos_ENABLE_SERIAL=ON -DMallard_DIM=3 -DMallard_ENABLE_HDF5=ON", "hdf5": true, "full": true},
            {"name": "float", "flags": "-DKokkos_ENABLE_OPENMP=ON -DMallard_USE_DOUBLE=OFF -DMallard_ENABLE_ZLIB=ON", "full": true, "concurrent": true, "gate": true},
            {"name": "float-3d", "flags": "-DKokkos_ENABLE_OPENMP=ON -DMallard_USE_DOUBLE=OFF -DMallard_DIM=3 -DMallard_ENABLE_HDF5=ON -DMallard_ENABLE_CGNS=ON", "cgns": true, "full": true, "gate": true},
            {"name": "gcc-16", "flags": "-DKokkos_ENABLE_OPENMP=ON -DCMAKE_C_COMPILER=/usr/local/bin/gcc -DCMAKE_CXX_COMPILER=/usr/local/bin/g++", "container": "gcc:16.2.0", "cmake": "4.2.3", "gate": true},
            {"name": "clang-22", "flags": "-DKokkos_ENABLE_SERIAL=ON -DMallard_USE_DOUBLE=OFF -DMallard_ENABLE_HDF5=ON -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22", "hdf5": true},
            {"name": "clang-23", "flags": "-DKokkos_ENABLE_SERIAL=ON -DMallard_DIM=3 -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23", "llvm": "23", "shards": 2, "gate": true},
            {"name": "gcc-15-arm64", "flags": "-DKokkos_ENABLE_OPENMP=ON -DMallard_ENABLE_HDF5=ON -DMallard_ENABLE_CGNS=ON -DMallard_ENABLE_ZLIB=ON", "cgns": true, "os": "ubuntu-26.04-arm"},
            {"name": "mpi-arm64", "flags": "-DKokkos_ENABLE_SERIAL=ON -DMallard_ENABLE_MPI=ON -DMallard_ENABLE_KAMINPAR=ON -DMallard_ENABLE_HDF5=ON -DMallard_ENABLE_ZLIB=ON", "mpi": true, "os": "ubuntu-26.04-arm"},
            {"name": "gcc-16-arm64", "flags": "-DKokkos_ENABLE_OPENMP=ON -DMallard_USE_DOUBLE=OFF -DMallard_DIM=3 -DMallard_ENABLE_HDF5=ON -DMallard_ENABLE_CGNS=ON -DCMAKE_C_COMPILER=/usr/local/bin/gcc -DCMAKE_CXX_COMPILER=/usr/local/bin/g++", "cgns": true, "container": "gcc:16.2.0", "cmake": "4.2.3", "os": "ubuntu-26.04-arm"},
            {"name": "clang-22-arm64", "flags": "-DKokkos_ENABLE_OPENMP=ON -DMallard_USE_DOUBLE=OFF -DMallard_ENABLE_ZLIB=ON -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22", "packages": "libomp-22-dev", "concurrent": true, "os": "ubuntu-26.04-arm"},
            {"name": "clang-23-arm64", "flags": "-DKokkos_ENABLE_SERIAL=ON -DMallard_DIM=3 -DMallard_ENABLE_HDF5=ON -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23", "hdf5": true, "llvm": "23", "os": "ubuntu-26.04-arm"},
            {"name": "macos", "flags": "-DKokkos_ENABLE_THREADS=ON", "os": "macos-26"},
            {"name": "macos-3d", "flags": "-DKokkos_ENABLE_THREADS=ON -DMallard_DIM=3", "os": "macos-26"},
            {"name": "macos-gcc", "flags": "-DKokkos_ENABLE_THREADS=ON -DCMAKE_C_COMPILER=gcc-16 -DCMAKE_CXX_COMPILER=g++-16", "os": "macos-26", "packages": "gcc"}
          ]'
          # -f only names the jobs whatever their tier; otherwise the gate, or everything
          if [ -n "$ONLY" ]; then
            backends=$(jq -c --arg only ",$ONLY," 'map(select(.name as $n | $only | contains("," + $n + ",")))' <<< "$backends")
          elif [ "$FULL" != true ]; then
            # The gate's MPI jobs leave the whole suite on one rank to the jobs without MPI
            backends=$(jq -c 'map(select(.gate) | .full = false)' <<< "$backends")
          fi
          # A backend with shards runs as that many jobs, <name>-<i>of<n>, each building and
          # running every n-th test of each suite run (googletest's sharding); names and -f only
          # stay per backend, and the jobs share the backend's compiler cache
          backends=$(jq -c 'map(if .shards then . as $b | range(1; $b.shards + 1)
                                  | $b + {shard: ., job: "\($b.name)-\(.)of\($b.shards)"}
                                else . + {job: .name} end)' <<< "$backends")
          echo "any=$(jq 'length > 0' <<< "$backends")" >> "$GITHUB_OUTPUT"
          echo "backends=$(jq -c . <<< "$backends")" >> "$GITHUB_OUTPUT"
          sh tools/dev/ci_status.sh queued $(jq -r '.[].job' <<< "$backends")

  build-and-test:
    needs: matrix
    if: needs.matrix.outputs.any == 'true'
    runs-on: ${{ matrix.backend.os || 'ubuntu-26.04' }}
    container: ${{ matrix.backend.container || '' }}
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(needs.matrix.outputs.backends) }}
    name: ${{ matrix.backend.job }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Report the job as running
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ job.check_run_id }}
          STATUS_NAME: ${{ matrix.backend.job }}
        run: sh tools/dev/ci_status.sh running
      # Read by googletest in every suite run below; mpirun's ranks inherit it
      - name: Shard the suite
        if: matrix.backend.shard
        env:
          SHARD: ${{ matrix.backend.shard }}
          SHARDS: ${{ matrix.backend.shards }}
        run: printf 'GTEST_TOTAL_SHARDS=%s\nGTEST_SHARD_INDEX=%s\n' "$SHARDS" "$((SHARD - 1))" >> "$GITHUB_ENV"
      # Both read by every suite run below: googletest's filter, and a JUnit report per process
      # (tools/dev/test_coverage.py's map and this report let a dispatch rerun only the
      # tests a change can affect)
      - name: Select the tests and record their results
        env:
          FILTER: ${{ inputs.gtest_filter }}
        run: |
          mkdir -p "$RUNNER_TEMP/junit"
          echo "MALLARD_TEST_XML=$RUNNER_TEMP/junit" >> "$GITHUB_ENV"
          printf '%s\n' "$FILTER" > "$RUNNER_TEMP/junit/filter.txt"
          if [ -n "$FILTER" ]; then echo "GTEST_FILTER=$FILTER" >> "$GITHUB_ENV"; fi
      - name: Install MPI
        timeout-minutes: 25
        if: matrix.backend.mpi
        run: >
          sh tools/dev/apt_install.sh
          libopenmpi-dev openmpi-bin libtbb-dev libhdf5-openmpi-dev
      - name: Install HDF5
        timeout-minutes: 25
        if: matrix.backend.hdf5
        run: sh tools/dev/apt_install.sh libhdf5-dev
      - name: Install CGNS
        timeout-minutes: 25
        if: matrix.backend.cgns
        run: sh tools/dev/apt_install.sh libhdf5-dev libcgns-dev
      - name: Install ccache
        timeout-minutes: 25
        if: runner.os == 'Linux'
        run: >
          sh tools/dev/apt_install.sh
          ccache ${{ matrix.backend.packages }}
      - name: Install ccache (macOS)
        timeout-minutes: 15
        if: runner.os == 'macOS'
        run: brew install ccache ${{ matrix.backend.packages }}
      - name: Install Clang ${{ matrix.backend.llvm }} (apt.llvm.org)
        if: matrix.backend.llvm
        timeout-minutes: 25
        env:
          LLVM: ${{ matrix.backend.llvm }}
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/resolute/ llvm-toolchain-resolute-$LLVM main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sh tools/dev/apt_install.sh clang-$LLVM
      # Kitware's build of the oldest CMake that Mallard supports (cmake_minimum_required)
      - name: Install CMake ${{ matrix.backend.cmake }}
        if: matrix.backend.cmake
        env:
          VERSION: ${{ matrix.backend.cmake }}
        run: |
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v$VERSION/cmake-$VERSION-linux-$(uname -m).tar.gz" |
            tar -xz -C /opt
          echo "/opt/cmake-$VERSION-linux-$(uname -m)/bin" >> "$GITHUB_PATH"
      # Branches restore main's latest cache. The name ends with a slash: a bare prefix
      # (ccache-mpi-) also matched other backends' caches (ccache-mpi-3d-...)
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache/${{ matrix.backend.name }}/${{ github.sha }}
          restore-keys: ccache/${{ matrix.backend.name }}/
      - name: Configure
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DUSE_SYSTEM_KOKKOS=OFF -DMallard_WARNINGS_AS_ERRORS=ON ${{ matrix.backend.flags }}
      # The statistics count this build only. On main, the cache it saves keeps only what this
      # build used (a hit renews an entry), so it holds one tree and stays small
      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1G
        run: |
          cmake --version | head -1
          ccache -z > /dev/null
          start=$(date +%s)
          cmake --build build -j $(getconf _NPROCESSORS_ONLN) -- -k
          ccache --show-stats
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            ccache --evict-older-than $(( $(date +%s) - start + 60 ))s
          fi
      - name: Save compiler cache
        if: github.ref == 'refs/heads/main' && (!matrix.backend.shard || matrix.backend.shard == 1)
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache/${{ matrix.backend.name }}/${{ github.sha }}
      - name: Test
        if: ${{ !matrix.backend.mpi && !matrix.backend.build_only && !matrix.backend.concurrent }}
        env:
          OMP_NUM_THREADS: 2
          KOKKOS_NUM_THREADS: 2
        run: ./build/src/mallard test
      - name: Upgrade the inputs of every release
        if: matrix.backend.name == 'openmp'
        run: |
          git fetch --quiet --tags --depth=1 origin
          python3 tools/dev/check_upgrade_input.py build/src/mallard
      - name: Restart files through tools/mallard/restart.py and the tools
        if: matrix.backend.name == 'openmp' || matrix.backend.name == 'clang-23-arm64'
        run: |
          python3 -c 'import numpy, scipy' 2>/dev/null || python3 -m pip install -q --break-system-packages numpy scipy
          python3 tools/dev/check_restart_tools.py build/src/mallard
      - name: Output units through h5py and tools/mallard
        if: matrix.backend.name == 'openmp'
        run: |
          python3 -c 'import h5py, numpy' 2>/dev/null || python3 -m pip install -q --break-system-packages h5py numpy
          python3 tools/dev/check_output_units.py build/src/mallard
      # Two copies of the suite at once, so tests that share a file path collide
      - name: Test (two at once)
        if: matrix.backend.concurrent
        env:
          OMP_NUM_THREADS: 2
        run: |
          ./build/src/mallard test & first=$!
          ./build/src/mallard test --gtest_brief=1 & second=$!
          ok=true; wait $first || ok=false; wait $second || ok=false; $ok
      - name: Test (MPI)
        if: matrix.backend.mpi
        timeout-minutes: 90
        env:
          FULL: ${{ matrix.backend.full }}
          # A test that hangs (a collective some ranks never reach) aborts and names itself
          MALLARD_TEST_TIMEOUT: 600
        run: |
          mpi_tests='CommTest.*:MeshBlockTest.*:DistributedMeshTest.*:MPITest.*:MPI3DTest.*:Check*.*:ProbesTest.*'
          # A filter of this step, restricted to the dispatch's GTEST_FILTER (empty: no test)
          list() { mpirun -n 1 ./build/src/mallard test --gtest_list_tests --gtest_filter="$1" |
                   awk '/^[^ ].*\.$/ { s = $1 } /^  / { print s $1 }' | sort; }
          only() {
            if [ -z "${GTEST_FILTER:-}" ]; then echo "$1"; return; fi
            comm -12 <(list "$1") <(list "$GTEST_FILTER") | paste -sd: -
          }
          if [ "$FULL" = true ]; then
            mpirun -n 1 ./build/src/mallard test
          else
            one=$(only "$mpi_tests:CliTest.*:FrontEndTest.*:RunControlTest.*")
            if [ -n "$one" ]; then mpirun -n 1 ./build/src/mallard test --gtest_filter="$one"; fi
          fi
          mpi=$(only "$mpi_tests")
          # Every test on 3 ranks, so none assumes a single rank; two rank
          # counts at once, so tests that share a file path collide
          if [ -n "$mpi" ]; then mpirun -n 2 --oversubscribe ./build/src/mallard test --gtest_filter="$mpi" & two=$!; fi
          mpirun -n 3 --oversubscribe ./build/src/mallard test --gtest_brief=1 & three=$!
          ok=true; if [ -n "$mpi" ]; then wait "$two" || ok=false; fi; wait $three || ok=false; $ok
          if [ -n "$mpi" ]; then mpirun -n 4 --oversubscribe ./build/src/mallard test --gtest_filter="$mpi"; fi
      # Every rank in the report, and no warning about a sensible placement
      - name: Rank report (MPI)
        if: matrix.backend.name == 'mpi' && (!matrix.backend.shard || matrix.backend.shard == 1)
        run: |
          dir=$(mktemp -d)
          sed -e 's/^t_stop = .*/n_steps = 2/' -e '/^\[\[write_data\]\]/,$d' examples/sod/input.toml > "$dir/input.toml"
          for n in 2 3; do
            # 3 ranks exceed the runner's 2 cores: unbound, sharing them
            status=0
            (cd "$dir" && mpirun -n $n --oversubscribe "$GITHUB_WORKSPACE/build/src/mallard" -i input.toml) \
              > "$dir/out.txt" 2>&1 || status=$?
            cat "$dir/out.txt"
            [ "$status" -eq 0 ] || exit "$status"
            rows=$(sed -n '/^== Ranks/,/^$/p' "$dir/out.txt" | grep -cE '^  [0-9]+ ')
            [ "$rows" -eq "$n" ] || { echo "expected $n rows in the rank report, found $rows"; exit 1; }
            if grep -q 'warning:' "$dir/out.txt"; then echo "unexpected warning"; exit 1; fi
          done
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.backend.job }}
          path: ${{ runner.temp }}/junit
          if-no-files-found: ignore
          retention-days: 30
      - name: Report the job's result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ job.check_run_id }}
          STATUS_NAME: ${{ matrix.backend.job }}
        run: sh tools/dev/ci_status.sh ${{ job.status }}

  # The tutorials (tutorials/) at reduced size: Gmsh meshes, runs on two MPI
  # ranks and their post-processing scripts, so they keep working
  tutorials:
    needs: [changelog, device]
    if: >-
      needs.device.outputs.code == 'true' && (inputs.only && contains(format(',{0},', inputs.only), ',tutorials,')
      || !inputs.only && needs.device.outputs.full == 'true')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Report the job as running
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ job.check_run_id }}
          STATUS_NAME: tutorials
        run: sh tools/dev/ci_status.sh running
      - name: Install MPI, ccache and Gmsh's libraries
        timeout-minutes: 25
        run: >
          sh tools/dev/apt_install.sh
          libopenmpi-dev openmpi-bin libhdf5-openmpi-dev ccache libglu1-mesa libxcursor1 libxft2 libxinerama1 zsh fish
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python packages
        run: pip install -r tutorials/requirements.txt imageio imageio-ffmpeg
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache/tutorials/${{ github.sha }}
          restore-keys: ccache/tutorials/
      # With HDF5, so that the tutorials and templates write the default VTKHDF output
      - name: Build (2D and 3D)
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1G
        run: |
          ccache -z > /dev/null
          start=$(date +%s)
          for dim in 2 3; do
            cmake -S . -B build-$dim -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DUSE_SYSTEM_KOKKOS=OFF -DMallard_WARNINGS_AS_ERRORS=ON -DKokkos_ENABLE_SERIAL=ON \
              -DMallard_ENABLE_MPI=ON -DMallard_ENABLE_HDF5=ON -DMallard_DIM=$dim
            cmake --build build-$dim -j $(nproc) --target mallard
          done
          ccache --show-stats
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            ccache --evict-older-than $(( $(date +%s) - start + 60 ))s
          fi
      - name: Save compiler cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache/tutorials/${{ github.sha }}
      # Both dimensions in one install, run through the mallard front end
      - name: Install (2D and 3D)
        run: for dim in 2 3; do cmake --install build-$dim --prefix ${{ runner.temp }}/mallard > /dev/null; done
      # The scripts the install wrote: bash and fish complete through them, zsh parses its own
      - name: Shell completion of the install
        run: |
          export PATH=${{ runner.temp }}/mallard/bin:$PATH
          share=${{ runner.temp }}/mallard/share
          zsh -n $share/zsh/site-functions/_mallard
          fish -n $share/fish/vendor_completions.d/mallard.fish
          expect() {
            fish --no-config -c "source $share/fish/vendor_completions.d/mallard.fish; complete -C '$1'" | cut -f1 > "$RUNNER_TEMP/fish.txt"
            grep -qxE -- "$2" "$RUNNER_TEMP/fish.txt" || { echo "fish: '$1' offers no $2:"; cat "$RUNNER_TEMP/fish.txt"; exit 1; }
          }
          expect 'mallard ' check
          expect 'mallard input ' upgrade
          expect 'mallard --restart ' latest
          expect 'mallard new ' cylinder
          expect 'mallard ctl . ' status
          expect 'mallard check -' --ranks
          expect 'mallard test --gtest_fi' '--gtest_filter=?'
          bash -c ". $share/bash-completion/completions/mallard; COMP_WORDS=(mallard new ''); COMP_CWORD=2; _mallard
                   printf '%s\n' \"\${COMPREPLY[@]}\"" | grep -qx cylinder
      - name: Run the tutorials
        run: tutorials/ci.sh ${{ runner.temp }}/mallard/bin/mallard ${{ runner.temp }}/tutorials
      # docs/input-keys.json is what setup reads from the examples and tutorials
      - name: Check the key catalog
        run: python3 tools/dev/input_catalog.py build --mallard-2d build-2/src/mallard --mallard-3d build-3/src/mallard --check
      # Every case template (mallard new --quick)
      - name: Run the case templates
        run: templates/ci.sh ${{ runner.temp }}/mallard/bin/mallard ${{ runner.temp }}/templates
      - name: Report the job's result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ job.check_run_id }}
          STATUS_NAME: tutorials
        run: sh tools/dev/ci_status.sh ${{ job.status }}

  # CUDA builds (no GPU needed): on main, on branches whose changes touch device code (see
  # the device job), and when the dispatch asks for them (-f device=true); host code
  # compiles with nvcc too, so main catches what branches skip.
  cuda:
    needs: [changelog, device]
    if: >-
      (needs.device.outputs.changed == 'true' || github.ref == 'refs/heads/main' || inputs.device)
      && (!inputs.only || contains(format(',{0},', inputs.only), ',device,'))
    runs-on: ${{ matrix.toolchain.os }}
    container: nvidia/cuda:${{ matrix.toolchain.cuda }}-devel-ubuntu26.04
    strategy:
      fail-fast: false
      matrix:
        dim: [2, 3]
        # CUDA 13.5 on x86-64 in the gate; also 13.4 and arm64 in the full tier (the device job)
        toolchain: ${{ fromJSON(needs.device.outputs.cuda) }}
    name: ${{ matrix.toolchain.name }}-${{ matrix.dim }}d
    # sccache caches the nvcc compiles in the GitHub Actions cache, per object, so branches
    # reuse what main compiled. Neither ccache nor sccache accepts Kokkos' nvcc_wrapper as a
    # compiler, so sccache wraps the nvcc that nvcc_wrapper runs (the first one on PATH)
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      # Without git in the image, checkout downloads the sources through the REST API:
      # enough for the install script; the checkout after it clones with submodules
      - uses: actions/checkout@v4
      - name: Install tools
        timeout-minutes: 25
        run: >
          sh tools/dev/apt_install.sh --no-install-recommends
          git cmake make curl libopenmpi-dev openmpi-bin ca-certificates
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Report the job as running
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ job.check_run_id }}
          STATUS_NAME: ${{ matrix.toolchain.name }}-${{ matrix.dim }}d
        run: sh tools/dev/ci_status.sh running
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Put sccache in front of nvcc
        run: |
          mkdir -p "$RUNNER_TEMP/nvcc-sccache"
          printf '#!/bin/sh\nexec sccache /usr/local/cuda/bin/nvcc "$@"\n' > "$RUNNER_TEMP/nvcc-sccache/nvcc"
          chmod +x "$RUNNER_TEMP/nvcc-sccache/nvcc"
          echo "$RUNNER_TEMP/nvcc-sccache" >> "$GITHUB_PATH"
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUSE_SYSTEM_KOKKOS=OFF
          -DKokkos_ENABLE_CUDA=ON ${{ matrix.toolchain.arch }} -DKokkos_ENABLE_OPENMP=ON
          -DCMAKE_CXX_COMPILER=$PWD/src/external/kokkos/bin/nvcc_wrapper
          -DCUDAToolkit_ROOT=/usr/local/cuda
          -DMallard_ENABLE_MPI=ON -DMallard_GPU_AWARE_MPI=ON -DMallard_WARNINGS_AS_ERRORS=ON
          -DMallard_DIM=${{ matrix.dim }}
      - name: Build
        run: cmake --build build -j $(nproc)
      - name: Cache statistics
        if: always()
        run: sccache --show-stats
      - name: Report the job's result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ job.check_run_id }}
          STATUS_NAME: ${{ matrix.toolchain.name }}-${{ matrix.dim }}d
        run: sh tools/dev/ci_status.sh ${{ job.status }}

  # HIP and SYCL builds (no GPU; never run), when the changes touch device code or the
  # dispatch asks for them (-f device=true): every source through the ROCm and oneAPI
  # compilers, for portability errors and warnings the GCC, Clang and nvcc builds miss.
  # sccache caches the compiles that it can (hipcc and icpx calls it does not recognize
  # run uncached).
  portability:
    needs: [changelog, device]
    if: >-
      (needs.device.outputs.changed == 'true' || inputs.device)
      && (!inputs.only || contains(format(',{0},', inputs.only), ',device,'))
    runs-on: ubuntu-26.04
    container: ${{ matrix.toolchain.image }}
    strategy:
      fail-fast: false
      matrix:
        dim: [2, 3]
        toolchain:
          - name: hip
            image: rocm/dev-ubuntu-26.04:10.1.0-full
            flags: >-
              -DCMAKE_CXX_COMPILER=/opt/rocm/bin/hipcc -DCMAKE_PREFIX_PATH=/opt/rocm -DKokkos_ENABLE_HIP=ON
              -DKokkos_ARCH_AMD_GFX90A=ON -DKokkos_ENABLE_ROCTHRUST=OFF
          - name: sycl
            image: ubuntu:26.04
            oneapi: '2026.2'
            flags: >-
              -DCMAKE_CXX_COMPILER=icpx -DKokkos_ENABLE_SYCL=ON
              -DKokkos_ARCH_INTEL_GEN=ON -DKokkos_ENABLE_ONEDPL=OFF
    name: ${{ matrix.toolchain.name }}-${{ matrix.dim }}d
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      # Without git in the image, checkout downloads the sources through the REST API:
      # enough for the install script; the checkout after it clones with submodules
      - uses: actions/checkout@v4
      # g++ and gfortran keep GCC at Ubuntu's default: libopenmpi-dev alone pulls in GCC 16's
      # gfortran and C compiler but not its libstdc++ headers, and hipcc and icpx use the
      # newest GCC they find
      - name: Install tools
        timeout-minutes: 25
        run: >
          sh tools/dev/apt_install.sh --no-install-recommends
          git cmake make curl g++ gfortran libopenmpi-dev openmpi-bin ca-certificates
      # The oneAPI image lags the releases: the compiler from Intel's apt repository
      - name: Install oneAPI ${{ matrix.toolchain.oneapi }}
        if: matrix.toolchain.oneapi
        timeout-minutes: 25
        shell: bash
        env:
          ONEAPI: ${{ matrix.toolchain.oneapi }}
        run: |
          sh tools/dev/apt_install.sh --no-install-recommends gpg
          curl -fsSL https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB |
            gpg --dearmor -o /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            > /etc/apt/sources.list.d/oneAPI.list
          sh tools/dev/apt_install.sh intel-oneapi-compiler-dpcpp-cpp-$ONEAPI
          . /opt/intel/oneapi/setvars.sh > /dev/null
          env | grep -E '^(LD_LIBRARY_PATH|LIBRARY_PATH|CPATH|CMPLR_ROOT|OCL_ICD_FILENAMES)=' >> "$GITHUB_ENV"
          # In a container job, a PATH in GITHUB_ENV is replaced by the image's PATH
          echo "$PATH" | tr ':' '\n' | grep '^/opt/intel/' >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Report the job as running
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ job.check_run_id }}
          STATUS_NAME: ${{ matrix.toolchain.name }}-${{ matrix.dim }}d
        run: sh tools/dev/ci_status.sh running
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUSE_SYSTEM_KOKKOS=OFF
          -DKokkos_ENABLE_SERIAL=ON ${{ matrix.toolchain.flags }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DMallard_ENABLE_MPI=ON -DMallard_GPU_AWARE_MPI=ON -DMallard_WARNINGS_AS_ERRORS=ON
          -DMallard_DIM=${{ matrix.dim }}
      - name: Build
        run: cmake --build build -j $(nproc) -- -k
      - name: Cache statistics
        if: always()
        run: sccache --show-stats
      - name: Report the job's result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ job.check_run_id }}
          STATUS_NAME: ${{ matrix.toolchain.name }}-${{ matrix.dim }}d
        run: sh tools/dev/ci_status.sh ${{ job.status }}

  # spack install of this checkout on Red Hat's Universal Base Images 8 and 9, as a user of
  # a RHEL-based cluster (TOSS 4 and 5) would: Spack builds GCC 15 with the system's GCC,
  # then Open MPI, HDF5 and Mallard's other dependencies with GCC 15, then Mallard, running
  # its 2D and 3D suites. The Spack installs are cached across runs, so a run with the cache
  # builds only Mallard. Spack runs as a user: the suites start runs under mpirun, which
  # refuses root.
  spack:
    needs: [changelog, device]
    if: >-
      needs.device.outputs.code == 'true' && (inputs.only && contains(format(',{0},', inputs.only), ',spack,')
      || !inputs.only && needs.device.outputs.full == 'true')
    runs-on: ubuntu-26.04
    container: registry.access.redhat.com/${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: ubi8-spack, image: ubi8/ubi:latest}
          - {name: ubi9-spack, image: ubi9/ubi:latest}
    name: ${{ matrix.name }}
    timeout-minutes: 360
    env:
      SPACK_VERSION: v1.2.2
      SPACK_PACKAGES_VERSION: v2026.10.1
    defaults:
      run:
        shell: runuser -u ci -- bash -e {0}
    steps:
      - name: Install the system's build tools
        shell: bash -e {0}
        run: |
          dnf install -y -q git gcc gcc-c++ gcc-gfortran make patch bzip2 xz unzip file \
            python3 which findutils tar diffutils gzip util-linux
          useradd -m ci
          mkdir -p /opt/spack-opt /opt/env
          chown ci:ci /opt /opt/spack-opt /opt/env
          echo /opt/spack/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Report the job as running
        shell: bash -e {0}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ job.check_run_id }}
          STATUS_NAME: ${{ matrix.name }}
        run: sh tools/dev/ci_status.sh running
      # A change to the package restores the latest tree, and Spack reuses what still fits
      - name: Restore the Spack installs
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /opt/spack-opt
          key: spack-${{ matrix.name }}-${{ env.SPACK_VERSION }}-${{ env.SPACK_PACKAGES_VERSION }}-${{ hashFiles('spack/spack_repo/mallard/packages/mallard/package.py') }}
          restore-keys: spack-${{ matrix.name }}-${{ env.SPACK_VERSION }}-${{ env.SPACK_PACKAGES_VERSION }}-
      - name: Hand the checkout and the installs to the user
        shell: bash -e {0}
        run: chown -R ci:ci "$GITHUB_WORKSPACE" /opt/spack-opt
      - name: Install Spack
        run: |
          git clone -q --depth 1 -b "$SPACK_VERSION" https://github.com/spack/spack /opt/spack
          git clone -q --depth 1 -b "$SPACK_PACKAGES_VERSION" https://github.com/spack/spack-packages /opt/spack-packages
          export PATH=/opt/spack/bin:$PATH
          spack repo set --destination /opt/spack-packages builtin
          spack repo add "$GITHUB_WORKSPACE/spack/spack_repo/mallard"
          spack config add config:install_tree:root:/opt/spack-opt
          spack config add "config:build_jobs:$(nproc)"
          spack compiler find
      # As in docs/installation.md: GCC 15 first, then Mallard with it
      - name: Install GCC 15 and Mallard's dependencies
        run: |
          spack install --fail-fast gcc@15
          cat > /opt/env/spack.yaml << EOF
          spack:
            specs: ["mallard@main %gcc@15"]
            view: false
            develop:
              mallard: {spec: mallard@=main, path: $GITHUB_WORKSPACE}
          EOF
          spack -e /opt/env concretize
          spack -e /opt/env install --fail-fast --only dependencies
      - name: Save the Spack installs
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/spack-opt
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Install and test Mallard (2D and 3D)
        env:
          OMP_NUM_THREADS: 2
        run: |
          spack -e /opt/env install --fail-fast --test=root mallard
          spack -e /opt/env test run mallard
      - name: Report the job's result
        if: always()
        shell: bash -e {0}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ job.check_run_id }}
          STATUS_NAME: ${{ matrix.name }}
        run: sh tools/dev/ci_status.sh ${{ job.status }}

  # Each libFuzzer harness for a minute (2D); fuzz.yml also runs nightly, longer
  fuzz:
    needs: [changelog, device]
    if: >-
      needs.device.outputs.code == 'true' && (inputs.only && contains(format(',{0},', inputs.only), ',fuzz,')
      || !inputs.only && needs.device.outputs.full == 'true')
    permissions:
      contents: read
      actions: read
      statuses: write
    uses: ./.github/workflows/fuzz.yml

  # Sets the commit status `CI` that main requires: success when every job passed or was
  # skipped for a reason (device builds without device code), failure otherwise. After a
  # merge, a failure opens an issue labeled ci-main (or adds the run to the open one), and
  # the next success closes it.
  result:
    name: CI result
    if: always()
    needs: [changelog, device, matrix, build-and-test, tutorials, cuda, portability, spack, fuzz]
    runs-on: ubuntu-26.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          ONLY: ${{ inputs.only }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.name != "CI result" and .status == "completed"
                                   and (.conclusion == "skipped" or .conclusion == "cancelled"))
                  | [.name, .conclusion, .html_url] | @tsv' |
          while IFS=$'\t' read -r name conclusion url; do
            case "$name" in *'{{'*) name=${name%%'{{'*}; name=${name%-'$'} ;; esac
            case "$conclusion" in skipped) s=success; d=Skipped ;; *) s=error; d=Cancelled ;; esac
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=$s \
              -f context="CI / $name" -f description="$d" -f target_url="$url" < /dev/null > /dev/null || true
          done
          state=success
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) state=failure ;; esac
          done
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=$state -f context=CI \
            -f description="Jobs: $RESULTS${ONLY:+ (only $ONLY)}" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "Job results: $RESULTS"
          if [ "$GITHUB_EVENT_NAME" = push ] || [ "$GITHUB_EVENT_NAME" = schedule ]; then
            run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            failed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion == "failure" and .name != "CI result") | "- [\(.name)](\(.html_url))"')
            open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --label ci-main --json number -q '.[0].number')
            if [ "$state" != success ]; then
              gh label create ci-main -R "$GITHUB_REPOSITORY" --color B60205 \
                --description "main fails CI after a merge" 2> /dev/null || true
              body=$(printf 'CI fails on main at %s ([run](%s)):\n\n%s\n' "$GITHUB_SHA" "$run" "$failed")
              if [ -n "$open" ]; then gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "$body"
              else gh issue create -R "$GITHUB_REPOSITORY" --title "CI fails on main" --label ci-main --body "$body"; fi
            elif [ -n "$open" ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
              gh issue close "$open" -R "$GITHUB_REPOSITORY" --comment "CI passes on main at $GITHUB_SHA ([run]($run))."
            fi
          fi
          [ "$state" = success ]
