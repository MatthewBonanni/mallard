name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'CITATION.cff'
      - 'LICENSE'
      - '.github/workflows/pages.yml'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'CITATION.cff'
      - 'LICENSE'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests run three jobs that together cover every test: the full 2D
  # suite (OpenMP), the full 3D suite and the multi-rank tests. main also runs
  # the serial-backend and non-MPI 3D builds.
  matrix:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      backends: ${{ steps.pick.outputs.backends }}
    steps:
      - id: pick
        env:
          ALL: ${{ github.event_name != 'pull_request' }}
        run: |
          backends='[
            {"name": "openmp", "flags": "-DKokkos_ENABLE_OPENMP=ON", "full": true},
            {"name": "mpi", "flags": "-DKokkos_ENABLE_SERIAL=ON -DMallard_ENABLE_MPI=ON -DMallard_ENABLE_KAMINPAR=ON -DMallard_ENABLE_HDF5=ON", "mpi": true},
            {"name": "mpi-3d", "flags": "-DKokkos_ENABLE_SERIAL=ON -DMallard_ENABLE_MPI=ON -DMallard_DIM=3 -DMallard_ENABLE_HDF5=ON", "mpi": true, "full": true},
            {"name": "serial", "flags": "-DKokkos_ENABLE_SERIAL=ON", "full": true, "main_only": true},
            {"name": "serial-3d", "flags": "-DKokkos_ENABLE_SERIAL=ON -DMallard_DIM=3 -DMallard_ENABLE_HDF5=ON", "hdf5": true, "full": true, "main_only": true}
          ]'
          if [ "$ALL" != true ]; then backends=$(jq -c 'map(select(.main_only | not))' <<< "$backends"); fi
          echo "backends=$(jq -c . <<< "$backends")" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(needs.matrix.outputs.backends) }}
    name: ${{ matrix.backend.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install MPI
        if: matrix.backend.mpi
        run: >
          sudo apt-get update -qq && sudo apt-get install -y -qq
          libopenmpi-dev openmpi-bin libtbb-dev libhdf5-openmpi-dev
      - name: Install HDF5
        if: matrix.backend.hdf5
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libhdf5-dev
      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.backend.name }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.backend.name }}-
      - name: Configure
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DUSE_SYSTEM_KOKKOS=OFF ${{ matrix.backend.flags }}
      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 500M
        run: |
          cmake --build build -j $(nproc)
          ccache --show-stats
      - name: Save compiler cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.backend.name }}-${{ github.sha }}
      - name: Test
        if: ${{ !matrix.backend.mpi }}
        env:
          OMP_NUM_THREADS: 2
        run: ./build/test/MallardTest
      - name: Test (MPI)
        if: matrix.backend.mpi
        env:
          FULL: ${{ matrix.backend.full }}
        run: |
          mpi_tests='CommTest.*:MeshBlockTest.*:DistributedMeshTest.*:MPITest.*:MPI3DTest.*'
          if [ "$FULL" = true ]; then
            mpirun -n 1 ./build/test/MallardTest
          else
            mpirun -n 1 ./build/test/MallardTest --gtest_filter="$mpi_tests"
          fi
          for n in 2 3 4; do
            mpirun -n $n --oversubscribe ./build/test/MallardTest --gtest_filter="$mpi_tests"
          done

