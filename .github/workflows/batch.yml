name: Batch

# Lands several pull requests on one CI run (tools in the maintainers' own scripts): their
# heads are merged onto main in a batch/* branch, ci.yml runs there once, and this workflow
# then sets the commit status `CI` that main requires on each head the batch contains, so
# the pull requests can merge without a run each. Run from main:
#   gh workflow run batch.yml --ref main -f run=<ci.yml run on the batch> -f shas="<sha> ..."
on:
  workflow_dispatch:
    inputs:
      run:
        description: The passed ci.yml run on the batch branch
        type: string
        required: true
      shas:
        description: Space-separated head commits of the pull requests (and stack layers) in the batch
        type: string
        required: true
      tip:
        description: >-
          A commit with the same tree as the run's (its batch re-merged onto a newer main);
          the heads may then be in its history instead
        type: string
        default: ''

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  stamp:
    runs-on: ubuntu-26.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run }}
          SHAS: ${{ inputs.shas }}
          TIP: ${{ inputs.tip }}
        run: |
          read -r path event branch conclusion batch < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" \
            --jq '"\(.path) \(.event) \(.head_branch) \(.conclusion) \(.head_sha)"')
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN"
          echo "run $RUN: $path $event $branch $conclusion $batch"
          [ "$path" = .github/workflows/ci.yml ] && [ "$event" = workflow_dispatch ] \
            && [ "$conclusion" = success ] \
            || { echo "::error::$url is not a passed, dispatched ci.yml run"; exit 1; }
          ci=$(gh api "repos/$GITHUB_REPOSITORY/commits/$batch/status?per_page=100" \
            --jq '.statuses[] | select(.context == "CI") | "\(.state)\t\(.description)"')
          [ "${ci%%$'\t'*}" = success ] || { echo "::error::CI on the batch $batch is not success"; exit 1; }
          tree() { gh api "repos/$GITHUB_REPOSITORY/commits/$1" --jq .commit.tree.sha; }
          if [ -n "$TIP" ]; then
            [ "$(tree "$TIP")" = "$(tree "$batch")" ] || { echo "::error::$TIP's tree differs from $batch's"; exit 1; }
            batch=$TIP
          fi
          for sha in $SHAS; do
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$batch" --jq .status)
            case "$status" in ahead|identical) ;;
              *) echo "::error::$sha is not in the batch $batch ($status)"; exit 1 ;;
            esac
          done
          for sha in $SHAS; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state=success -f context=CI \
              -f description="Passed in batch ${batch:0:8} (run $RUN)" -f target_url="$url" > /dev/null
            echo "CI success on $sha"
          done
