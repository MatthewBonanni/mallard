# The features each test runs, for the feature matrix (docs/guide/features.md,
# made by tools/docs/feature_matrix.py, which CI runs with --check).
#
# One table per test file (test/<file>.cpp), one key per test, "Suite.Name" as
# its TEST macro names it. The value lists the features of the test's run, or a
# list of runs where the test runs several cases: every pair of features in one
# run counts as implemented. A test of the verification manual
# (docs/verification/results.json) must be listed; its studies verify the
# features common to all its runs and those its method names. Feature ids are
# those of FEATURES in tools/docs/feature_matrix.py; defaults count (an input
# without riemann_solver runs HLLC).

[axisymmetric_test]
"AxisymmetricQuiescent.GasAtUniformPressureStaysAtRest" = ["axisymmetric", "euler", "navier_stokes", "fo", "muscl", "teno3", "teno5", "hllc", "ssprk3", "periodic"]
